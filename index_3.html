"Left PCA"],a:0,e:"Inferior division supplies the temporal lobe and Wernicke's area — receptive aphasia with fluent output. Superior division supplies Broca's area, giving non-fluent expressive aphasia with preserved comprehension."},{id:"w5d4q3",d:4,q:"A 'malignant MCA syndrome' refers to:",o:["Massive MCA infarction with progressive oedema, midline shift and herniation","Recurrent TIAs in MCA territory","MCA aneurysm rupture","Watershed infarction"],a:0,e:"Typically deteriorates over 2–5 days. Decompressive hemicraniectomy within 48 hours reduces mortality substantially in selected patients under 60 — a landmark neurosurgical indication you should be able to discuss."},{id:"w5d4q4",d:4,q:"The 'hyperdense MCA sign' on non-contrast CT represents:",o:["Acute thrombus within the M1 segment","Calcification of the vessel wall","Contrast extravasation","Subarachnoid blood in the Sylvian fissure"],a:0,e:"An early, specific sign of large-vessel occlusion visible before parenchymal changes appear. Spotting it flags a candidate for thrombectomy — one of the highest-yield things a student can recognise on a CT."},{id:"w5d4q5",d:4,q:"Right MCA territory infarction in a right-handed patient typically causes:",o:["Left hemineglect and anosognosia rather than aphasia","Global aphasia","Pure leg weakness","Cortical blindness"],a:0,e:"The non-dominant parietal lobe mediates spatial attention. Neglect is easy to miss unless specifically tested with line bisection or double simultaneous stimulation — and it predicts poor rehabilitation outcome."},{id:"w5d5q1",d:5,q:"Watershed (borderzone) infarction typically occurs in which setting?",o:["Systemic hypotension or severe proximal stenosis, affecting territory between major arterial supplies","Cardioembolism","Small vessel lipohyalinosis","Venous thrombosis"],a:0,e:"Cortical watershed infarcts produce a 'man in a barrel' pattern of proximal arm weakness. Their presence should prompt evaluation of both haemodynamics and carotid patency, not just a search for embolic sources."},{id:"w5d5q2",d:5,q:"Moyamoya disease is characterised by:",o:["Progressive stenosis of the supraclinoid ICA with a fine collateral network","Aneurysmal dilatation of the basilar","Venous sinus thrombosis","Arteriovenous shunting in the cortex"],a:0,e:"Children present with ischaemia, adults more often with haemorrhage from fragile collaterals. Treatment is surgical revascularisation — direct STA–MCA bypass or indirect procedures such as encephaloduroarteriosynangiosis."},{id:"w5d5q3",d:5,q:"The main extracranial–intracranial collateral pathway when the ICA occludes is:",o:["External carotid branches to the ophthalmic artery, with reversed flow","The vertebral artery to the ACA","The middle meningeal artery to the MCA","The occipital artery to the basilar"],a:0,e:"Retrograde flow down the ophthalmic artery from facial and superficial temporal branches is demonstrable on Doppler and angiography — an important sign of chronic ICA occlusion and adequate compensation."},{id:"w5d5q4",d:5,q:"A balloon test occlusion is performed to:",o:["Assess whether a patient can tolerate permanent carotid sacrifice","Measure ICP","Treat vasospasm","Localise an aneurysm"],a:0,e:"Temporary balloon occlusion with neurological monitoring, sometimes with hypotensive challenge or perfusion imaging, predicts tolerance before deliberate vessel sacrifice in skull base tumour or complex aneurysm surgery."},{id:"w5d5q5",d:5,q:"Which vessel is the standard donor in an extracranial–intracranial bypass for anterior circulation ischaemia?",o:["Superficial temporal artery","Occipital artery","Facial artery","Internal maxillary artery"],a:0,e:"STA–MCA anastomosis is the workhorse direct bypass. The occipital artery is used for posterior circulation bypasses, and radial artery or saphenous vein grafts are used when high flow is required."},{id:"w5d6q1",d:6,q:"Which aneurysm location classically presents with a painful third nerve palsy?",o:["Posterior communicating artery origin","Anterior communicating artery","MCA bifurcation","PICA origin"],a:0,e:"The PCom aneurysm points laterally and inferiorly onto CN III as it runs to the cavernous sinus. A pupil-involving third nerve palsy is a neurosurgical emergency signalling an aneurysm that may be about to rupture."},{id:"w5d6q2",d:6,q:"The strongest modifiable risk factor for aneurysm formation and rupture is:",o:["Smoking","Hypercholesterolaemia","Diabetes","Obesity"],a:0,e:"Smoking and hypertension dominate. Non-modifiable factors include female sex, family history, polycystic kidney disease, Ehlers–Danlos type IV and fibromuscular dysplasia — worth asking about in every SAH history."},{id:"w5d6q3",d:6,q:"Which inherited condition is most strongly associated with intracranial aneurysms?",o:["Autosomal dominant polycystic kidney disease","Marfan syndrome","Neurofibromatosis type 1","Osteogenesis imperfecta"],a:0,e:"ADPKD carries roughly a fourfold increase in prevalence, and screening is considered in those with a positive family history of SAH. Ehlers–Danlos type IV is also strongly associated but far rarer."},{id:"w5d6q4",d:6,q:"A 'sentinel headache' before a major subarachnoid haemorrhage represents:",o:["A minor warning leak from the aneurysm, days to weeks before rupture","Migraine","Tension headache from stress","Vasospasm"],a:0,e:"Reported in a substantial minority of SAH patients and frequently missed. Any sudden-onset severe headache reaching maximum intensity within a minute deserves investigation, not reassurance."},{id:"w5d6q5",d:6,q:"Unruptured aneurysm rupture risk is best estimated by which factors?",o:["Size, location, patient population, and growth or morphology (as in the PHASES score)","Patient's blood pressure alone","Aneurysm wall thickness on CT","Age alone"],a:0,e:"Posterior circulation and PCom aneurysms rupture at higher rates than anterior circulation ones of the same size. PHASES is the commonly cited risk model — knowing its name and inputs is enough at student level."},{id:"w5d7q1",d:7,q:"Which artery is most likely responsible if a patient has contralateral face and arm weakness with expressive aphasia?",o:["Superior division of the left middle cerebral artery","Left anterior cerebral artery","Left posterior cerebral artery","Right middle cerebral artery"],a:0,e:"The superior division supplies the frontal operculum (Broca's area) and the face/arm motor cortex. Non-fluent aphasia with preserved comprehension plus face-arm predominant weakness is the classic pairing."},{id:"w5d7q2",d:7,q:"During pterional craniotomy for an MCA aneurysm, which fissure is split for access?",o:["The Sylvian fissure","The interhemispheric fissure","The calcarine fissure","The parieto-occipital fissure"],a:0,e:"Sylvian fissure dissection exposes the M1 and the bifurcation. Interhemispheric dissection is used for ACom and pericallosal aneurysms — matching the approach to the target is a good way to remember vascular anatomy."},{id:"w5d7q3",d:7,q:"The optic chiasm receives its blood supply mainly from:",o:["Branches of the ICA, ACom and ACA (superior hypophyseal system)","The PCA alone","The basilar artery","The middle meningeal artery"],a:0,e:"Its rich anastomotic supply is why chiasmal infarction is rare and visual loss there is usually compressive. The superior hypophyseal arteries must be preserved during transsphenoidal and clipping procedures."},{id:"w5d7q4",d:7,q:"A lacunar infarct causing pure motor hemiparesis most often involves:",o:["The posterior limb of the internal capsule or basis pontis","The cortex","The thalamus","The cerebellum"],a:0,e:"Lacunes result from small vessel lipohyalinosis in chronic hypertension. Pure motor, pure sensory, ataxic hemiparesis and dysarthria–clumsy hand are the classical lacunar syndromes — all lacking cortical signs like aphasia or neglect."},{id:"w5d7q5",d:7,q:"Why must you draw the circle of Willis repeatedly rather than just read about it?",o:["Because recall of spatial relationships requires active reconstruction, and you will be asked to draw it in interviews and vivas","Because reading is never useful","Because the anatomy changes with age","Because textbooks are inaccurate"],a:0,e:"Active recall by drawing consistently outperforms passive review for spatial anatomy. It is also a common request in neurosurgery interviews — a low-cost skill with a very high visibility payoff."}],6:[{id:"w6d1q1",d:1,q:"On an axial CT at the level of the basal ganglia, which territory occupies the region lateral to the insula and posterior Sylvian fissure?",o:["Middle cerebral artery","Anterior cerebral artery","Posterior cerebral artery","Anterior choroidal artery"],a:0,e:"The MCA supplies the lateral convexity, insula and deep grey via lenticulostriates. Learning territories on actual axial slices rather than on diagrams is what makes you able to call a stroke territory on a real scan."},{id:"w6d1q2",d:1,q:"The medial occipital lobe and calcarine cortex are supplied by:",o:["Posterior cerebral artery","Middle cerebral artery","Anterior cerebral artery","Superior cerebellar artery"],a:0,e:"PCA occlusion causes contralateral homonymous hemianopia, often with macular sparing because the occipital pole receives collateral MCA supply. Bilateral occlusion produces cortical blindness."},{id:"w6d1q3",d:1,q:"Anton syndrome describes:",o:["Cortical blindness with denial of the deficit","Blindness with intact pupillary reflexes and awareness","Visual agnosia only","Alexia without agraphia"],a:0,e:"Bilateral occipital infarction, usually from basilar tip embolism. Pupillary responses are preserved because the afferent pathway to the midbrain is intact — a useful bedside clue that blindness is cortical rather than ocular."},{id:"w6d1q4",d:1,q:"Alexia without agraphia results from a lesion of:",o:["Left occipital cortex plus the splenium of the corpus callosum","Broca's area","The arcuate fasciculus","The angular gyrus alone"],a:0,e:"Left PCA infarct disconnects the intact right visual cortex from left-hemisphere language areas. The patient can write but cannot read what they have just written — one of the most elegant disconnection syndromes in neurology."},{id:"w6d1q5",d:1,q:"Which artery supplies the thalamus most substantially?",o:["Posterior cerebral artery perforators and the posterior communicating artery","Middle cerebral artery","Anterior cerebral artery","Anterior inferior cerebellar artery"],a:0,e:"Thalamoperforators from the P1 segment and PCom, including the artery of Percheron variant which supplies both paramedian thalami from one pedicle. Percheron occlusion causes bilateral thalamic infarction with sudden coma."},{id:"w6d2q1",d:2,q:"Gerstmann syndrome consists of:",o:["Agraphia, acalculia, finger agnosia and left–right disorientation","Aphasia, apraxia, agnosia and amnesia","Ataxia, nystagmus and dysarthria","Neglect, anosognosia and hemianopia"],a:0,e:"A dominant angular gyrus (inferior parietal) lesion, usually in MCA territory. It is a classic localising cluster and a favourite exam question because all four elements point to one small region."},{id:"w6d2q2",d:2,q:"Conduction aphasia — fluent speech, intact comprehension, but very poor repetition — is caused by a lesion of:",o:["The arcuate fasciculus","Broca's area","Wernicke's area","The angular gyrus"],a:0,e:"The arcuate fasciculus connects posterior receptive to anterior expressive language regions. Testing repetition specifically is what separates conduction aphasia from Broca's and Wernicke's — always include it in a language examination."},{id:"w6d2q3",d:2,q:"Transcortical motor aphasia is distinguished from Broca's aphasia by:",o:["Preserved repetition","Preserved comprehension","Fluent output","Absent naming"],a:0,e:"The transcortical aphasias spare the perisylvian language loop, so repetition is intact — sometimes strikingly so, with echolalia. It typically follows a watershed infarct anterior or superior to Broca's area."},{id:"w6d2q4",d:2,q:"Which cortical sign most reliably distinguishes a cortical from a lacunar stroke?",o:["Aphasia, neglect or a visual field deficit","Facial weakness","Hemiparesis","Dysarthria"],a:0,e:"Lacunar syndromes by definition lack cortical signs. Their presence indicates large-vessel or embolic disease and changes both the workup and the eligibility for thrombectomy."},{id:"w6d2q5",d:2,q:"A patient cannot recognise familiar faces after a stroke. Where is the lesion?",o:["Bilateral or right fusiform gyrus (occipitotemporal)","Left temporal pole","Bilateral frontal lobes","Right parietal lobe"],a:0,e:"Prosopagnosia localises to the fusiform face area, usually in PCA territory. It is a good illustration that occipital strokes cause more than simple field loss."},{id:"w6d3q1",d:3,q:"The commonest location for hypertensive intracerebral haemorrhage is:",o:["The putamen and basal ganglia","The lobar white matter","The cerebellum","The brainstem"],a:0,e:"Basal ganglia (putamen) is commonest, followed by thalamus, pons and cerebellum — all territories of small perforating vessels. Lobar haemorrhage in an elderly normotensive patient should instead raise suspicion of cerebral amyloid angiopathy."},{id:"w6d3q2",d:3,q:"Recurrent lobar haemorrhage in an elderly patient suggests:",o:["Cerebral amyloid angiopathy","Hypertensive vasculopathy","Aneurysmal rupture","Venous infarction"],a:0,e:"Amyloid deposition in cortical and leptomeningeal vessels. MRI gradient-echo or SWI showing multiple lobar microbleeds supports the diagnosis, and it argues against long-term anticoagulation."},{id:"w6d3q3",d:3,q:"Which intracerebral haemorrhage most clearly warrants urgent surgical evacuation?",o:["Cerebellar haemorrhage over 3 cm with deterioration or brainstem compression","Small thalamic haemorrhage","Deep basal ganglia haemorrhage in a stable patient","Pontine haemorrhage"],a:0,e:"Cerebellar haematoma is the clearest surgical indication because posterior fossa compensation is minimal and deterioration is abrupt. Deep supratentorial clot evacuation has not shown consistent benefit in trials."},{id:"w6d3q4",d:3,q:"The 'spot sign' on CT angiography in intracerebral haemorrhage indicates:",o:["Active contrast extravasation, predicting haematoma expansion","Old calcified haemorrhage","An underlying aneurysm","Venous congestion"],a:0,e:"It identifies patients at high risk of early expansion and clinical deterioration, and is used to select patients for intensive blood pressure control and closer monitoring."},{id:"w6d3q5",d:3,q:"Initial blood pressure management in acute spontaneous intracerebral haemorrhage generally aims for:",o:["Controlled lowering of systolic pressure to around 140 mmHg in eligible patients","No intervention regardless of pressure","Rapid reduction to below 100 mmHg","Induced hypertension"],a:0,e:"Early intensive lowering reduces haematoma growth and is generally safe, though the effect on functional outcome is modest. Avoid precipitous drops, particularly where raised ICP may compromise cerebral perfusion pressure."},{id:"w6d4q1",d:4,q:"The conventional window for intravenous thrombolysis in ischaemic stroke is:",o:["Within 4.5 hours of known onset, with imaging-selected extension in some patients","Within 24 hours in all patients","Within 12 hours","Within 1 hour only"],a:0,e:"Perfusion imaging now allows selected patients beyond the standard window, and thrombectomy extends further still — up to 24 hours in carefully selected large-vessel occlusions with favourable mismatch."},{id:"w6d4q2",d:4,q:"The ASPECTS score is used to:",o:["Quantify early ischaemic change on non-contrast CT in MCA territory","Grade subarachnoid haemorrhage","Score level of consciousness","Assess aneurysm rupture risk"],a:0,e:"A 10-point score where lower values indicate more established infarction. It helps select patients for thrombectomy — low ASPECTS suggests a large completed core with less to salvage."},{id:"w6d4q3",d:4,q:"Haemorrhagic transformation after ischaemic stroke is most likely in:",o:["Large infarcts, cardioembolic strokes and after reperfusion therapy","Small lacunar infarcts","Watershed infarcts","Transient ischaemic attacks"],a:0,e:"Reperfusion into infarcted, permeable tissue is the mechanism. It underpins the caution about early anticoagulation in large cardioembolic strokes, where timing is usually deferred by days."},{id:"w6d4q4",d:4,q:"Decompressive hemicraniectomy for malignant MCA infarction is best supported in:",o:["Patients under about 60 years, operated within 48 hours of onset","All ages at any time","Patients over 75 only","Only after 7 days"],a:0,e:"Pooled trial data show a clear mortality reduction and improved functional outcome in younger patients treated early. Above 60 mortality still falls but survival with severe disability becomes more likely — a genuine consent discussion, not an automatic decision."},{id:"w6d4q5",d:4,q:"The NIHSS is used to:",o:["Quantify stroke severity in a standardised way for treatment decisions and monitoring","Predict aneurysm rupture","Grade intracerebral haemorrhage volume","Assess coma depth"],a:0,e:"A 0–42 scale. Free online certification takes about an hour and is a concrete, quick addition to a medical student's portfolio — worth doing before your next elective."},{id:"w6d5q1",d:5,q:"Carotid endarterectomy provides the greatest benefit in:",o:["Symptomatic stenosis of 70–99% operated within two weeks of the event","Asymptomatic 50% stenosis","Complete occlusion","Symptomatic stenosis under 30%"],a:0,e:"The benefit is greatest and the number needed to treat lowest when surgery is early after symptoms. A completely occluded vessel is not revascularised — an important distinction from a near occlusion."},{id:"w6d5q2",d:5,q:"Which nerve is most commonly injured during carotid endarterectomy?",o:["Hypoglossal nerve","Vagus nerve","Facial nerve","Accessory nerve"],a:0,e:"CN XII crosses the carotid bifurcation and is at risk during exposure, causing tongue deviation. The marginal mandibular branch of VII, the vagus and the superior laryngeal nerve are also vulnerable."},{id:"w6d5q3",d:5,q:"Cerebral hyperperfusion syndrome after carotid revascularisation presents with:",o:["Headache, seizures and possible intracerebral haemorrhage in a chronically hypoperfused hemisphere","Immediate hemiplegia","Cortical blindness only","Fever and neck stiffness"],a:0,e:"Chronically dilated vessels lose autoregulation and are suddenly exposed to normal pressure. Strict blood pressure control after the procedure is the key preventive measure."},{id:"w6d5q4",d:5,q:"Carotid artery dissection typically presents with:",o:["Neck or face pain, partial Horner syndrome and delayed cerebral ischaemia","Sudden thunderclap headache with meningism","Bilateral leg weakness","Painless progressive dementia"],a:0,e:"It is a leading cause of stroke in young adults, often after minor trauma or neck manipulation. Anticoagulation or antiplatelet therapy is used; the Horner's is partial because sudomotor fibres follow the external carotid."},{id:"w6d5q5",d:5,q:"A carotid bruit is best described as:",o:["An unreliable indicator of the degree of stenosis, which may disappear as stenosis becomes critical","Directly proportional to stenosis severity","Diagnostic of over 70% stenosis","Present only in occlusion"],a:0,e:"Flow must be turbulent to generate sound; a very tight stenosis or occlusion may be silent. Imaging, not auscultation, determines management."},{id:"w6d6q1",d:6,q:"On non-contrast CT within the first few hours of ischaemic stroke, which sign appears earliest?",o:["Loss of grey–white differentiation and insular ribbon sign","Frank hypodensity of the whole territory","Midline shift","Contrast enhancement"],a:0,e:"Subtle cortical swelling with sulcal effacement and loss of the insular ribbon precedes obvious hypodensity. Being able to spot these early changes is far more useful than recognising a day-old infarct."},{id:"w6d6q2",d:6,q:"Diffusion-weighted MRI detects acute infarction because:",o:["Cytotoxic oedema restricts water diffusion, appearing bright with low ADC","It shows blood flow directly","It detects haemorrhage only","It requires contrast"],a:0,e:"DWI becomes positive within minutes. A bright DWI with a dark ADC map confirms acute infarction; bright on both suggests 'T2 shine-through' from an older lesion — a distinction worth knowing."},{id:"w6d6q3",d:6,q:"Perfusion–diffusion mismatch represents:",o:["Hypoperfused but still salvageable penumbra surrounding the infarct core","Artefact","Old infarction","Haemorrhagic transformation"],a:0,e:"The mismatch is the target of reperfusion therapy. Large mismatch with a small core identifies patients who may benefit from thrombectomy well beyond conventional time windows."},{id:"w6d6q4",d:6,q:"On CT, acute blood is hyperdense because of:",o:["Haemoglobin protein density, which decreases as the clot degrades over days","Calcium content","Iron paramagnetism","Contrast retention"],a:0,e:"Acute clot is around 50–70 HU and becomes isodense at roughly one to two weeks, then hypodense. This timeline explains why a subacute subdural can be nearly invisible on CT — MRI is more reliable then."},{id:"w6d6q5",d:6,q:"In a patient with severe anaemia, an acute haematoma on CT may appear:",o:["Isodense or less hyperdense than expected","More hyperdense than usual","Unchanged","With a fluid level only in the ventricles"],a:0,e:"Density depends on haemoglobin concentration. Severe anaemia or coagulopathy can render acute blood deceptively isodense — and a fluid–fluid level within a haematoma should always raise suspicion of coagulopathy."},{id:"w6d7q1",d:7,q:"A patient has contralateral hemiparesis worse in the leg, abulia and urinary incontinence. Which territory?",o:["Anterior cerebral artery","Middle cerebral artery","Posterior cerebral artery","Anterior choroidal artery"],a:0,e:"Medial frontal and cingulate involvement gives the behavioural and continence features alongside leg-predominant weakness. This triad should make ACA your first thought."},{id:"w6d7q2",d:7,q:"Which single bedside feature best separates ACA from MCA territory infarction?",o:["Whether the leg or the face and arm is more affected","Presence of headache","Level of consciousness","Pupil size"],a:0,e:"The homunculus does the work: medial surface is leg (ACA), lateral convexity is face and arm (MCA). Everything else follows from that one spatial fact."},{id:"w6d7q3",d:7,q:"Bilateral thalamic infarction with sudden coma and vertical gaze palsy suggests occlusion of:",o:["The artery of Percheron","Both PICAs","The anterior spinal artery","Both MCAs"],a:0,e:"A variant where a single perforator from one P1 supplies both paramedian thalami. It is a well-known cause of unexplained coma with a deceptively normal early CT — think of it when imaging looks bland."},{id:"w6d7q4",d:7,q:"A young patient with stroke, migraine and subcortical white matter changes on MRI and a family history should be evaluated for:",o:["CADASIL","Amyloid angiopathy","Fabry disease only","Moyamoya"],a:0,e:"CADASIL is a NOTCH3 mutation causing recurrent subcortical strokes, migraine with aura and progressive cognitive decline, with characteristic anterior temporal pole white matter change."},{id:"w6d7q5",d:7,q:"In a patient with hemiparesis, what single question most efficiently narrows the territory?",o:["'Is the leg weaker than the arm, or the arm and face weaker than the leg?'","'When did it start?'","'Do you have a headache?'","'Are you on blood thinners?'"],a:0,e:"The other questions matter for management, but for localisation the pattern of weakness is the highest-yield discriminator. Practise asking it on every stroke patient until it is automatic."}],7:[{id:"w7d1q1",d:1,q:"The vertebral artery is conventionally divided into four segments. Which segment runs within the transverse foramina?",o:["V2","V1","V3","V4"],a:0,e:"V1 from subclavian to the C6 transverse foramen; V2 through the foramina to C2; V3 the extradural loop over C1; V4 intradural to the basilar. V3 is the segment at risk in far-lateral and craniocervical junction approaches."},{id:"w7d1q2",d:1,q:"Which artery is the largest branch of the vertebral artery?",o:["Posterior inferior cerebellar artery (PICA)","Anterior inferior cerebellar artery","Superior cerebellar artery","Anterior spinal artery"],a:0,e:"PICA arises from V4 and supplies the lateral medulla, inferior cerebellum and choroid plexus of the fourth ventricle. AICA and SCA both arise from the basilar."},{id:"w7d1q3",d:1,q:"The basilar artery is formed by the union of:",o:["The two vertebral arteries at the pontomedullary junction","The two internal carotid arteries","The posterior communicating arteries","The anterior spinal arteries"],a:0,e:"It runs in the prepontine cistern along the clivus and terminates at the pontomesencephalic junction by dividing into the two posterior cerebral arteries — the basilar tip, a notoriously difficult aneurysm site."},{id:"w7d1q4",d:1,q:"Which artery accompanies cranial nerves VII and VIII into the internal acoustic meatus?",o:["Anterior inferior cerebellar artery","Posterior inferior cerebellar artery","Superior cerebellar artery","Basilar perforators"],a:0,e:"AICA gives the labyrinthine artery. Its occlusion causes sudden deafness and vertigo with facial weakness — the AICA syndrome, distinguishable from PICA/Wallenberg by the presence of hearing loss."},{id:"w7d1q5",d:1,q:"The superior cerebellar artery is clinically significant in relation to which cranial nerve?",o:["The trigeminal nerve — it is the usual offending vessel in trigeminal neuralgia","The facial nerve","The abducens nerve","The hypoglossal nerve"],a:0,e:"SCA loops against the trigeminal root entry zone. CN III and IV also pass between SCA and PCA, which is why basilar tip and SCA aneurysms can present with oculomotor palsy."},{id:"w7d2q1",d:2,q:"Which of these is NOT a feature of lateral medullary (Wallenberg) syndrome?",o:["Contralateral facial pain and temperature loss","Ipsilateral Horner syndrome","Ipsilateral ataxia","Dysphagia and hoarseness"],a:0,e:"Facial sensory loss is ipsilateral because the spinal trigeminal nucleus is affected before decussation; body loss is contralateral via the already-crossed spinothalamic tract. Limb weakness is characteristically absent — the pyramid is spared."},{id:"w7d2q2",d:2,q:"Why is there no hemiparesis in classic Wallenberg syndrome?",o:["The corticospinal tract lies medially in the pyramid, outside the lateral medullary territory","The corticospinal tract has already decussated","Motor fibres bypass the medulla","Weakness is always present"],a:0,e:"The lesion is lateral; the pyramids are medial and supplied by the anterior spinal artery. The absence of weakness in a patient with dramatic vertigo and dysphagia is itself the localising clue."},{id:"w7d2q3",d:2,q:"Medial medullary syndrome is caused by occlusion of:",o:["Anterior spinal artery or vertebral artery branches","PICA","AICA","SCA"],a:0,e:"It produces ipsilateral tongue weakness (XII), contralateral hemiparesis (pyramid) and contralateral loss of proprioception and vibration (medial lemniscus) — sometimes called Dejerine syndrome."},{id:"w7d2q4",d:2,q:"A patient has intractable hiccups, vertigo, and inability to swallow after vertebral dissection. Which structure explains the swallowing failure?",o:["Nucleus ambiguus","Nucleus solitarius","Hypoglossal nucleus","Dorsal motor nucleus of vagus"],a:0,e:"Nucleus ambiguus supplies pharyngeal and laryngeal muscles via IX and X. Wallenberg patients often require nasogastric feeding initially, and aspiration is the leading early complication."},{id:"w7d2q5",d:2,q:"Ondine's curse — loss of automatic breathing with preserved voluntary breathing — results from damage to:",o:["Medullary respiratory centres, often bilaterally","The pons only","The cervical cord at C5","The phrenic nerve"],a:0,e:"A rare but memorable complication of high cervical or medullary surgery and of bilateral lateral medullary infarction. Patients become apnoeic when they fall asleep."},{id:"w7d3q1",d:3,q:"Locked-in syndrome results from a lesion where, and what is preserved?",o:["Ventral pons — vertical eye movements and blinking are preserved","Bilateral cortex — nothing is preserved","Medulla — swallowing is preserved","Midbrain — horizontal gaze is preserved"],a:0,e:"Basilar occlusion infarcting the ventral pons destroys corticospinal and corticobulbar tracts while sparing the reticular formation (so consciousness is intact) and the midbrain vertical gaze centres. Always test vertical eye movement in an apparently unresponsive patient."},{id:"w7d3q2",d:3,q:"The paramedian pontine reticular formation (PPRF) controls:",o:["Ipsilateral horizontal (conjugate) gaze","Vertical gaze","Convergence","Pupillary constriction"],a:0,e:"A PPRF lesion causes gaze deviation *away* from the lesion — the eyes look away from the side of a pontine lesion but *towards* the side of a hemispheric lesion. That reversal is a classic exam discriminator."},{id:"w7d3q3",d:3,q:"'One-and-a-half syndrome' is caused by a lesion involving:",o:["The PPRF or abducens nucleus plus the ipsilateral MLF","The oculomotor nucleus alone","Bilateral optic tracts","The cerebellum"],a:0,e:"One eye has no horizontal movement at all and the other can only abduct — hence 'one and a half'. It localises tightly to the dorsal pons and is usually demyelination or infarction."},{id:"w7d3q4",d:3,q:"Central pontine myelinolysis is classically precipitated by:",o:["Rapid correction of chronic hyponatraemia","Rapid correction of hypernatraemia","Hypoglycaemia","Hypercalcaemia"],a:0,e:"Correct sodium by no more than about 8–10 mmol/L in 24 hours in chronic hyponatraemia. This is directly relevant to neurosurgery, where SIADH and cerebral salt wasting are everyday problems."},{id:"w7d3q5",d:3,q:"Pinpoint but reactive pupils in a comatose patient suggest a lesion of:",o:["The pons","The midbrain","The medulla","The cortex"],a:0,e:"Pontine lesions interrupt descending sympathetic fibres leaving parasympathetic tone unopposed. Midbrain lesions give mid-position fixed pupils; uncal herniation gives a unilateral fixed dilated pupil. Pupils are the fastest localiser in coma."},{id:"w7d4q1",d:4,q:"Top-of-the-basilar syndrome typically causes:",o:["Visual, oculomotor and behavioural abnormalities with variable motor findings","Pure motor hemiparesis","Isolated hearing loss","Bilateral leg weakness only"],a:0,e:"Embolic occlusion at the basilar tip affects both PCAs, thalami and rostral midbrain — producing cortical blindness, vertical gaze palsy, somnolence and confusion. Motor sparing can make it deceptively subtle."},{id:"w7d4q2",d:4,q:"Benedikt syndrome differs from Weber syndrome by the addition of:",o:["Contralateral tremor and ataxia from red nucleus involvement","Contralateral hemianopia","Ipsilateral facial palsy","Bilateral ptosis"],a:0,e:"Weber is ventral (CN III plus peduncle); Benedikt is more dorsal, adding the red nucleus and sometimes the medial lemniscus. Both are midbrain syndromes with an ipsilateral third nerve palsy."},{id:"w7d4q3",d:4,q:"Vertebrobasilar insufficiency classically causes which combination of symptoms?",o:["Vertigo, diplopia, dysarthria, dysphagia, ataxia and drop attacks","Isolated aphasia","Unilateral arm weakness alone","Monocular blindness"],a:0,e:"The 'five Ds' plus ataxia. Crucially, isolated vertigo without other posterior circulation features is far more often peripheral — but a first episode with new headache or neck pain should prompt imaging."},{id:"w7d4q4",d:4,q:"The HINTS examination is used to:",o:["Distinguish central from peripheral causes of acute vestibular syndrome","Grade coma","Assess aneurysm risk","Test cranial nerve VII"],a:0,e:"Head Impulse, Nystagmus, Test of Skew. A *normal* head impulse test, direction-changing nystagmus or skew deviation suggests a central (stroke) cause — counterintuitively, a normal test is the worrying one."},{id:"w7d4q5",d:4,q:"Cerebellar infarction is dangerous chiefly because:",o:["Swelling in the confined posterior fossa causes fourth ventricular compression, hydrocephalus and brainstem compression","It always causes immediate death","It invariably haemorrhages","It causes cortical blindness"],a:0,e:"Deterioration typically occurs on days two to four. Suboccipital decompressive craniectomy with or without EVD is life-saving — one of the clearest emergency neurosurgical indications in stroke care."},{id:"w7d5q1",d:5,q:"A lesion of the cerebellar vermis characteristically causes:",o:["Truncal ataxia and gait instability","Limb dysmetria only","Contralateral hemiparesis","Intention tremor of the hands only"],a:0,e:"Midline (vermian) lesions affect trunk and gait; hemispheric lesions affect ipsilateral limb coordination. Medulloblastoma in children classically arises in the vermis and presents with a broad-based gait plus hydrocephalus."},{id:"w7d5q2",d:5,q:"Cerebellar signs are ipsilateral to the lesion because:",o:["The cerebellar output decussates twice — via the superior peduncle and then the corticospinal tract","The cerebellum does not decussate at all","It receives only ipsilateral input","Signs are actually contralateral"],a:0,e:"The double crossing means the net effect returns to the same side. Remembering the 'two crossings cancel out' rule saves you from the commonest error in cerebellar localisation."},{id:"w7d5q3",d:5,q:"Which cerebellar peduncle carries the main output to the thalamus and cortex?",o:["Superior cerebellar peduncle","Middle cerebellar peduncle","Inferior cerebellar peduncle","All equally"],a:0,e:"Superior = mainly output (via dentatorubrothalamic tract). Middle = input from the contralateral pontine nuclei. Inferior = input from spinal cord and medulla. Output/input is the simplest way to keep them straight."},{id:"w7d5q4",d:5,q:"Posterior fossa syndrome (cerebellar mutism) occurs most often:",o:["In children after resection of a midline posterior fossa tumour","After frontal lobe surgery in adults","After carotid endarterectomy","After spinal surgery"],a:0,e:"Transient mutism with emotional lability and ataxia appearing one to two days after surgery, attributed to dentatothalamocortical pathway disruption. Most recover but often incompletely — an important consent point in paediatric neuro-oncology."},{id:"w7d5q5",d:5,q:"Which finding distinguishes cerebellar ataxia from sensory ataxia?",o:["Sensory ataxia worsens markedly with eyes closed (positive Romberg); cerebellar ataxia does not","Cerebellar ataxia has no gait involvement","Sensory ataxia causes nystagmus","They cannot be distinguished clinically"],a:0,e:"Romberg's test isolates proprioceptive input. A positive Romberg points to dorsal column or peripheral nerve disease, not cerebellum — a distinction routinely got wrong in exams."},{id:"w7d6q1",d:6,q:"Chiari I malformation is defined by:",o:["Cerebellar tonsillar descent more than 5 mm below the foramen magnum","Herniation of vermis and fourth ventricle with myelomeningocele","Cerebellar agenesis","Enlarged fourth ventricle with vermian hypoplasia"],a:0,e:"Chiari II involves vermis, brainstem and fourth ventricle displacement and is almost always associated with myelomeningocele. Dandy–Walker is the enlarged fourth ventricle with vermian hypoplasia."},{id:"w7d6q2",d:6,q:"The classic headache of Chiari I malformation is:",o:["Suboccipital, brought on by coughing, straining or Valsalva","Frontal and worse in the morning","Unilateral and throbbing with photophobia","Positional, relieved by lying flat"],a:0,e:"Tussive headache from transient pressure dissociation across the foramen magnum. Its presence, rather than tonsillar position alone, drives the decision to operate — many tonsillar ectopias are incidental."},{id:"w7d6q3",d:6,q:"Syringomyelia associated with Chiari I classically produces:",o:["A 'cape-like' dissociated sensory loss of pain and temperature with preserved light touch","Complete sensory loss below the lesion","Pure motor weakness","Bilateral leg spasticity only"],a:0,e:"The expanding central cavity first interrupts decussating spinothalamic fibres in the anterior white commissure, sparing dorsal columns. Patients present with painless burns or injuries to the hands."},{id:"w7d6q4",d:6,q:"Basilar invagination refers to:",o:["Upward migration of the odontoid process into the foramen magnum","Downward displacement of the cerebellar tonsils","Fusion of C2 and C3","Absence of the posterior arch of C1"],a:0,e:"Assessed with McRae, Chamberlain and McGregor lines. It occurs in rheumatoid arthritis, osteogenesis imperfecta and Down syndrome, and can cause brainstem compression requiring decompression and fusion."},{id:"w7d6q5",d:6,q:"Vertebral artery dissection should be suspected in a young patient with:",o:["Occipital or neck pain followed by posterior circulation symptoms, often after neck manipulation or trauma","Sudden thunderclap headache with photophobia only","Slowly progressive dementia","Bilateral leg weakness"],a:0,e:"It is a major cause of posterior circulation stroke in the young. If the dissection is intradural it can cause subarachnoid haemorrhage — a critical distinction because antithrombotics would then be contraindicated."},{id:"w7d7q1",d:7,q:"Which rule most reliably localises a brainstem lesion to a side?",o:["Cranial nerve signs are ipsilateral; long tract signs are contralateral","All signs are contralateral","All signs are ipsilateral","Only motor signs localise"],a:0,e:"The 'rule of crossed findings'. Because cranial nerve nuclei are at the level of the lesion but long tracts cross lower, a crossed pattern tells you both the level and the side. It is the single most powerful heuristic in brainstem neurology."},{id:"w7d7q2",d:7,q:"The 'rule of 4' in brainstem anatomy states that:",o:["There are 4 midline structures beginning with M, 4 lateral beginning with S, 4 cranial nerves in the medulla, pons and above the pons","There are 4 arteries supplying the brainstem","Each cranial nerve has 4 nuclei","The brainstem has 4 segments"],a:0,e:"Midline: Motor pathway, Medial lemniscus, Medial longitudinal fasciculus, Motor nuclei (III, IV, VI, XII). Lateral: Spinocerebellar, Spinothalamic, Sensory nucleus of V, Sympathetic. It is a genuinely useful scaffold for a viva."},{id:"w7d7q3",d:7,q:"Which cranial nerve nuclei are found in the midline of the brainstem?",o:["III, IV, VI and XII — those that divide into 12","V, VII, IX and X","I, II, V and VIII","VIII, IX, X and XI"],a:0,e:"The motor nuclei whose number divides evenly into 12 lie medially; the rest are lateral. It sounds like a trick but it is anatomically reliable and quick to apply under pressure."},{id:"w7d7q4",d:7,q:"A patient has sudden deafness, vertigo, ipsilateral facial weakness and ipsilateral Horner's. Which artery?",o:["Anterior inferior cerebellar artery","Posterior inferior cerebellar artery","Superior cerebellar artery","Basilar perforators"],a:0,e:"AICA supplies the lateral pons and the labyrinth via the internal auditory artery. Hearing loss is the discriminating feature that separates AICA from PICA (Wallenberg) syndrome."},{id:"w7d7q5",d:7,q:"Basilar artery occlusion has high mortality primarily because:",o:["It infarcts the brainstem, which has no collateral supply and controls vital functions","It causes immediate cortical blindness","It always causes haemorrhage","It cannot be imaged"],a:0,e:"Untreated mortality approaches 80–90%. This is why posterior circulation thrombectomy is considered in extended time windows despite weaker trial evidence than for anterior circulation — the natural history is so poor."}],8:[{id:"w8d1q1",d:1,q:"Trace the normal venous drainage from the superior sagittal sinus to the internal jugular vein.",o:["SSS → confluence of sinuses (torcular) → transverse sinus → sigmoid sinus → jugular bulb → internal jugular vein","SSS → straight sinus → cavernous sinus → IJV","SSS → sigmoid → transverse → IJV","SSS → inferior sagittal sinus → transverse → IJV"],a:0,e:"Learn this chain as a single sequence. The SSS usually drains preferentially into the right transverse sinus, and the straight sinus into the left — which is why the right IJV is often dominant."},{id:"w8d1q2",d:1,q:"The straight sinus is formed by the union of:",o:["The inferior sagittal sinus and the great vein of Galen","The two transverse sinuses","The superior and inferior petrosal sinuses","The cavernous sinus and the sphenoparietal sinus"],a:0,e:"It runs in the junction of falx and tentorium to the torcular. Because it drains the deep venous system, straight sinus thrombosis causes bilateral thalamic and basal ganglia venous infarction — a dramatic and characteristic picture."},{id:"w8d1q3",d:1,q:"The cavernous sinus drains posteriorly via which routes?",o:["Superior petrosal sinus to the transverse sinus and inferior petrosal sinus to the internal jugular vein","Straight sinus only","Superior sagittal sinus","Vein of Labbé"],a:0,e:"It also communicates anteriorly with the superior ophthalmic vein and inferiorly through emissary veins to the pterygoid plexus — the valveless route by which facial infection can reach the sinus."},{id:"w8d1q4",d:1,q:"The 'danger triangle' of the face is dangerous because:",o:["Valveless facial and ophthalmic veins allow retrograde spread of infection to the cavernous sinus","It contains the facial artery","It overlies the maxillary sinus","It has poor arterial supply"],a:0,e:"Infection from the nose or upper lip can ascend via the angular and superior ophthalmic veins to cause cavernous sinus thrombosis. Rare in the antibiotic era but anatomically instructive and still examined."},{id:"w8d1q5",d:1,q:"Which sinus lies in the free edge of the falx cerebri, above the corpus callosum?",o:["Inferior sagittal sinus","Superior sagittal sinus","Straight sinus","Occipital sinus"],a:0,e:"The superior sagittal sinus runs in the attached (convex) margin; the inferior sagittal in the free (concave) margin. Both drain posteriorly, the inferior joining the vein of Galen to form the straight sinus."},{id:"w8d2q1",d:2,q:"The internal cerebral veins are formed by the union of:",o:["The thalamostriate vein and the septal vein at the foramen of Monro","The basal veins of Rosenthal","The vein of Labbé and the vein of Trolard","The superior and inferior petrosal veins"],a:0,e:"Their junction — the venous angle — is a key angiographic landmark for the foramen of Monro. It is used to localise the ventricular anatomy on lateral angiograms and during transcallosal approaches."},{id:"w8d2q2",d:2,q:"The great vein of Galen is formed by:",o:["The two internal cerebral veins and the basal veins of Rosenthal","The vein of Labbé and the vein of Trolard","The superior sagittal and straight sinuses","The transverse sinuses"],a:0,e:"It is short, midline, and drains the entire deep venous system into the straight sinus. Its sacrifice is catastrophic, which is why pineal region surgery is planned meticulously around it."},{id:"w8d2q3",d:2,q:"A vein of Galen malformation in a neonate typically presents with:",o:["High-output cardiac failure","Seizures alone","Isolated hydrocephalus in adolescence","Sudden subarachnoid haemorrhage"],a:0,e:"Massive arteriovenous shunting overloads the heart. Older infants present with hydrocephalus and macrocephaly, and children with developmental delay. Endovascular embolisation is the mainstay of treatment."},{id:"w8d2q4",d:2,q:"The basal vein of Rosenthal drains which region?",o:["The medial temporal lobe, insula and basal forebrain, coursing around the midbrain","The frontal convexity","The occipital pole","The cerebellar hemispheres"],a:0,e:"It runs in the ambient cistern to join the vein of Galen. Its course around the midbrain makes it relevant in temporal and pineal region approaches."},{id:"w8d2q5",d:2,q:"Bilateral thalamic and basal ganglia hypodensities with haemorrhage suggest:",o:["Deep cerebral venous thrombosis (internal cerebral veins or straight sinus)","Bilateral MCA infarction","Hypertensive haemorrhage","Diffuse axonal injury"],a:0,e:"Venous infarction does not respect arterial territories and is frequently haemorrhagic. Bilateral deep grey involvement should immediately prompt CT or MR venography rather than a search for an arterial cause."},{id:"w8d3q1",d:3,q:"The vein of Labbé connects:",o:["The Sylvian region to the transverse sinus","The Sylvian region to the superior sagittal sinus","The cavernous sinus to the pterygoid plexus","The internal cerebral vein to the straight sinus"],a:0,e:"The inferior anastomotic vein. Sacrificing it during a temporal approach risks temporal lobe venous infarction, and on the dominant side, aphasia — one of the best-known avoidable complications in neurosurgery."},{id:"w8d3q2",d:3,q:"The vein of Trolard is the:",o:["Superior anastomotic vein draining to the superior sagittal sinus","Inferior anastomotic vein","Deep middle cerebral vein","Basal vein"],a:0,e:"Trolard is superior (to SSS), Labbé is inferior (to transverse sinus), and the superficial middle cerebral vein runs in the Sylvian fissure to the sphenoparietal or cavernous sinus. Learn them as a trio."},{id:"w8d3q3",d:3,q:"Why is the anterior third of the superior sagittal sinus sometimes sacrificable while the posterior third is not?",o:["Anterior collateral drainage is usually adequate; posterior occlusion causes bilateral parasagittal venous infarction","The anterior sinus carries no blood","The posterior sinus is easier to repair","There is no difference"],a:0,e:"This determines resectability in parasagittal meningiomas — a standard operative planning question. Posterior sacrifice risks bilateral leg weakness from parasagittal motor cortex infarction."},{id:"w8d3q4",d:3,q:"The 'cord sign' on non-contrast CT represents:",o:["A hyperdense thrombosed cortical vein","Calcified falx","Acute subarachnoid blood","An arterial thrombus"],a:0,e:"Alongside the 'dense triangle' (hyperdense thrombus in the SSS) and the 'empty delta sign' on contrast CT, it forms the classic imaging triad of cerebral venous sinus thrombosis."},{id:"w8d3q5",d:3,q:"The 'empty delta sign' refers to:",o:["Contrast enhancement of the dura around a non-enhancing thrombus in the superior sagittal sinus","A triangular area of infarction","An empty sella","A dilated fourth ventricle"],a:0,e:"Seen on contrast-enhanced CT in the posterior SSS. It appears roughly a week after thrombosis and is absent very early — so a normal contrast CT does not exclude the diagnosis."},{id:"w8d4q1",d:4,q:"Cerebral venous sinus thrombosis most commonly presents with:",o:["Headache, often with papilloedema, seizures or focal deficits crossing arterial territories","Sudden hemiplegia alone","Isolated fever","Painless visual loss"],a:0,e:"Headache is present in the great majority and may be the only symptom. Seizures are far commoner than in arterial stroke, and deficits that do not fit an arterial territory are the key clue."},{id:"w8d4q2",d:4,q:"First-line treatment of cerebral venous sinus thrombosis, even in the presence of venous haemorrhage, is:",o:["Anticoagulation","Antiplatelet therapy","Immediate surgical thrombectomy","Observation alone"],a:0,e:"This is counterintuitive but well established: anticoagulation improves outcome by preventing thrombus propagation, and haemorrhagic venous infarction is not a contraindication. Decompressive surgery is reserved for impending herniation."},{id:"w8d4q3",d:4,q:"Which is a recognised risk factor for cerebral venous sinus thrombosis?",o:["Pregnancy and the puerperium, oral contraceptives, thrombophilia, dehydration and local infection","Hypertension alone","Hyperlipidaemia","Atrial fibrillation"],a:0,e:"Note how different the risk profile is from arterial stroke — it follows Virchow's triad, not atherosclerosis. Mastoiditis and sinusitis remain important local causes, particularly in children."},{id:"w8d4q4",d:4,q:"Papilloedema with normal brain parenchyma on MRI but a filling defect on MR venography indicates:",o:["Venous sinus thrombosis causing secondary intracranial hypertension","Idiopathic intracranial hypertension","Optic neuritis","Pseudotumour from drusen"],a:0,e:"Impaired CSF absorption follows raised venous pressure. This is exactly why venography is mandatory before diagnosing IIH as idiopathic — you must exclude a treatable venous cause."},{id:"w8d4q5",d:4,q:"Venous sinus stenting is used in which situation?",o:["Selected patients with intracranial hypertension and a significant venous sinus stenosis with a pressure gradient","All patients with CVST","Acute arterial stroke","Cerebral aneurysm"],a:0,e:"Increasingly used in medically refractory IIH with demonstrable transverse sinus stenosis, as an alternative to CSF shunting or optic nerve sheath fenestration."},{id:"w8d5q1",d:5,q:"A dural arteriovenous fistula differs from a brain AVM in that:",o:["The shunt is within the dura, supplied by meningeal arteries, with no intervening nidus of brain tissue","It always occurs in children","It never bleeds","It is supplied only by the ICA"],a:0,e:"Most are acquired, often after venous sinus thrombosis or trauma. AVMs are congenital with a parenchymal nidus. The distinction changes both natural history and treatment approach."},{id:"w8d5q2",d:5,q:"Which feature of a dural AV fistula predicts the highest haemorrhage risk?",o:["Cortical venous reflux (retrograde leptomeningeal drainage)","Large size","Multiple arterial feeders","Location in the transverse sinus"],a:0,e:"The Borden and Cognard classifications are built around this. Fistulae draining only into a sinus are relatively benign; once flow refluxes into cortical veins, annual haemorrhage risk rises steeply and treatment is indicated."},{id:"w8d5q3",d:5,q:"Pulsatile tinnitus that is abolished by ipsilateral neck compression suggests:",o:["A dural arteriovenous fistula or other vascular cause near the transverse–sigmoid junction","Ménière disease","Otosclerosis","Vestibular schwannoma"],a:0,e:"A distinctive history worth eliciting. Objective pulsatile tinnitus warrants vascular imaging rather than routine audiology referral alone."},{id:"w8d5q4",d:5,q:"A carotid–cavernous fistula caused by rupture of a cavernous ICA aneurysm is classified as:",o:["Direct (type A) — high flow","Indirect (type B, C or D) — low flow","Dural AVM","Venous malformation"],a:0,e:"Direct fistulae are high-flow, usually traumatic or from aneurysm rupture, and present dramatically. Indirect fistulae are low-flow dural shunts from meningeal branches, presenting more insidiously in older patients."},{id:"w8d5q5",d:5,q:"A spinal dural AV fistula typically presents with:",o:["Progressive myelopathy from venous hypertension, often misdiagnosed for months","Acute paraplegia with back pain","Radicular pain only","Sudden subarachnoid haemorrhage"],a:0,e:"The commonest spinal vascular malformation, typically in older men, causing slowly progressive leg weakness and sphincter disturbance. MRI shows cord oedema with flow voids; it is curable if recognised, so the delay in diagnosis matters."},{id:"w8d6q1",d:6,q:"Venous air embolism is a particular risk during which neurosurgical position?",o:["Sitting position for posterior fossa surgery","Supine craniotomy","Prone lumbar surgery","Lateral decubitus"],a:0,e:"Non-collapsible dural sinuses above the level of the heart entrain air. Detection with precordial Doppler or end-tidal CO2 drop, and management by flooding the field, jugular compression and head-down positioning, are standard viva material."},{id:"w8d6q2",d:6,q:"During a retrosigmoid craniotomy, injury to which structure causes the most troublesome bleeding?",o:["The sigmoid or transverse sinus","The middle meningeal artery","The superior sagittal sinus","The vertebral artery"],a:0,e:"The bony exposure is defined by these sinuses. Bleeding is controlled with haemostatic agents and gentle packing rather than coagulation, since sacrificing a dominant sigmoid risks venous infarction."},{id:"w8d6q3",d:6,q:"Why should the dominant transverse sinus be identified before posterior fossa surgery?",o:["Because sacrificing the dominant sinus can cause venous infarction and raised ICP","Because it contains the facial nerve","Because it must always be sacrificed","Because it supplies the cerebellum arterially"],a:0,e:"Preoperative venography or MR venography defines dominance. This is a routine planning step and a good question to ask in theatre — it shows you are thinking about venous anatomy, which most students ignore."},{id:"w8d6q4",d:6,q:"Emissary veins are clinically important because they:",o:["Connect extracranial veins to dural sinuses and are valveless, permitting infection spread and troublesome bleeding","Supply the dura arterially","Drain the ventricles","Only exist in children"],a:0,e:"The mastoid emissary vein in particular can bleed briskly during retrosigmoid exposure. Their valveless nature is also the anatomical basis of intracranial spread from scalp and facial infection."},{id:"w8d6q5",d:6,q:"In raised intracranial pressure, why does jugular venous compression worsen the situation?",o:["It obstructs venous outflow, raising cerebral blood volume and therefore ICP","It reduces arterial inflow","It increases CSF production","It has no effect"],a:0,e:"This is why cervical collars must not be over-tight and why head-of-bed elevation to 30 degrees with the head midline is standard in head injury care — simple positioning measures that meaningfully lower ICP."},{id:"w8d7q1",d:7,q:"A patient develops seizures and a haemorrhagic parietal lesion that does not conform to an arterial territory, two weeks postpartum. What is the diagnosis?",o:["Cerebral venous sinus thrombosis","Arterial ischaemic stroke","Eclampsia with PRES","Hypertensive haemorrhage"],a:0,e:"The puerperium is a classic prothrombotic setting, and the non-arterial distribution with haemorrhage is characteristic. PRES is possible but typically posterior, bilateral and less haemorrhagic."},{id:"w8d7q2",d:7,q:"Which imaging modality best demonstrates cerebral venous sinus thrombosis?",o:["CT or MR venography","Non-contrast CT alone","Diffusion-weighted MRI alone","Carotid ultrasound"],a:0,e:"Non-contrast CT is normal in a substantial proportion of cases. If you suspect it clinically, you must specifically request venography — the study will not be done unless you ask."},{id:"w8d7q3",d:7,q:"Which venous structure is at greatest risk during a transcallosal approach to the third ventricle?",o:["Bridging veins to the superior sagittal sinus and the internal cerebral veins","The vein of Labbé","The sigmoid sinus","The superior petrosal sinus"],a:0,e:"Interhemispheric dissection requires working between bridging veins, and the deep venous system is encountered at the roof of the third ventricle. Venous injury here causes deep grey infarction with devastating consequences."},{id:"w8d7q4",d:7,q:"Cavernous sinus thrombosis is distinguished from orbital cellulitis by:",o:["Bilateral involvement, cranial nerve palsies and systemic toxicity","Unilateral proptosis alone","Absence of fever","Preserved eye movements"],a:0,e:"Spread across the intercavernous sinuses makes bilateral signs the giveaway. Multiple cranial nerve palsies (III, IV, V1, V2, VI) point to the sinus rather than the orbit."},{id:"w8d7q5",d:7,q:"Why do most students underperform on venous anatomy compared with arterial anatomy?",o:["It is less often taught and more variable, yet it determines operative approach and explains non-arterial infarct patterns","It is genuinely unimportant","It never appears in exams","It is identical to arterial anatomy"],a:0,e:"Venous anatomy is where you can visibly stand out: knowing why the vein of Labbé constrains a temporal approach, or asking which transverse sinus is dominant, marks you out immediately in theatre."}]},$=Object.keys(_).map(Number).sort((e,t)=>e-t),W=(e=new Map,$.forEach(t=>_[t].forEach(t=
