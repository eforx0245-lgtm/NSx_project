ptance"},{id:"c307",t:"Systematic review: quality assessment and analysis; start writing results"},{id:"c308",t:"Chase IRB approval weekly, politely"}]}]},{n:8,mon:"March",topic:"Spine",weeks:[31,32,33,34,35],lanes:[{label:"Knowledge",items:[{id:"c311",t:"Degenerative disease: disc herniation, canal and foraminal stenosis, spondylolisthesis"},{id:"c312",t:"Back pain red flags; cauda equina syndrome as a true emergency"},{id:"c313",t:"Cervical myelopathy: signs, mJOA, natural history, timing of surgery"},{id:"c314",t:"Common operations in principle: discectomy, laminectomy, ACDF, fusion"},{id:"c315",t:"Work through the free AO Surgery Reference spine modules"}]},{label:"Research",items:[{id:"c316",t:"Systematic review: complete draft to supervisor"},{id:"c317",t:"Design and print the SANS poster — one message, large type, minimal text"},{id:"c318",t:"Rehearse a 3-minute and a 60-second version out loud, several times"}]}]},{n:9,mon:"April",topic:"Cerebrovascular, paediatric & functional — CONFERENCE MONTH",weeks:[36,37,38,39],lanes:[{label:"Knowledge",items:[{id:"c321",t:"Aneurysmal SAH: Hunt–Hess, modified Fisher, rebleeding, vasospasm, clip vs coil"},{id:"c322",t:"AVMs and the Spetzler–Martin grade; cavernomas"},{id:"c323",t:"Spontaneous ICH: causes, surgical indications, blood pressure and reversal"},{id:"c324",t:"Paediatrics: myelomeningocele, Chiari I/II, craniosynostosis, posterior fossa tumours"},{id:"c325",t:"Functional: DBS targets, epilepsy surgery workup, trigeminal neuralgia"}]},{label:"Conference & research",items:[{id:"c326",t:"Attend SANS 2027 and present. Book the student boot camp if it runs again"},{id:"c327",t:"Have a 30-second self-introduction ready; use it on at least five consultants"},{id:"c328",t:"Follow up every meaningful conversation with an email within 48 hours"}]}],deliverable:"Broad subspecialty coverage, one poster presented, a second manuscript with your supervisor, and faces attached to names in Saudi neurosurgery."}]},{n:4,key:"p4",title:"Surgical principles & launch",dates:"May – July 2027",lede:"Half of the Saudi Board Part One exam is general surgical principles, not neurosurgery. It's also exactly what makes you useful as an intern. Learn it now and it pays twice.",months:[{n:10,mon:"May",topic:"Fluids, electrolytes, shock & haemostasis",weeks:[40,41,42,43],lanes:[{label:"Knowledge",items:[{id:"c401",t:"Fluid compartments, maintenance vs resuscitation, choice of fluid"},{id:"c402",t:"Sodium disorders — specifically SIADH vs cerebral salt wasting"},{id:"c403",t:"Diabetes insipidus after pituitary surgery and head injury"},{id:"c404",t:"Acid–base interpretation; potassium, calcium, magnesium"},{id:"c405",t:"Shock classification; coagulation cascade, anticoagulant reversal, transfusion thresholds"}]},{label:"Research",items:[{id:"c406",t:"Submit the systematic review"},{id:"c407",t:"With IRB approved, begin data collection for the chart review"}]}]},{n:11,mon:"June",topic:"Infection, wounds & perioperative critical care",weeks:[44,45,46,47],lanes:[{label:"Knowledge",items:[{id:"c411",t:"SSI prevention, antibiotic prophylaxis, sepsis recognition and bundles"},{id:"c412",t:"CNS infections: meningitis, brain abscess, subdural empyema, shunt infection"},{id:"c413",t:"Wound healing phases; the neurosurgical wound and CSF leak"},{id:"c414",t:"Perioperative assessment, VTE prophylaxis, sedation and ventilation basics"},{id:"c415",t:"Brain death determination and organ donation pathways"}]},{label:"Research",items:[{id:"c416",t:"Chart review: continue data collection; write the analysis plan before data is complete"},{id:"c417",t:"Respond to any reviewer comments on the systematic review"}]}]},{n:12,mon:"July",topic:"Transition to internship & application setup",weeks:[48,49,50,51,52],lanes:[{label:"Exam strategy — the biggest decision of the year",items:[{id:"c421",t:"Confirm your SLE eligibility window directly with SCFHS"},{id:"c422",t:"Plan a first attempt with room for a retake before the application deadline"},{id:"c423",t:"Block out a dedicated 3–4 month prep period in your internship calendar; pick your question bank now"}]},{label:"Portfolio assembly",items:[{id:"c424",t:"Collect official letters documenting every neurosurgery elective"},{id:"c425",t:"Request letters of recommendation while the year is fresh"},{id:"c426",t:"Build one folder with every certificate, publication PDF and evaluation — scanned, named, dated"},{id:"c427",t:"Plan internship rotations so a neurosurgery elective falls before the deadline"},{id:"c428",t:"Read the official matching booklet end to end. Re-check every point value here against it"}]}],deliverable:"Knowledge base built, 1–2 papers in the literature, a poster presented, letters secured, and a clear exam plan."}]}],R=[{id:"p01",t:"GPA protected through final year (~30% of the aggregate — the extras must not cost you this)"},{id:"p02",t:"At least one peer-reviewed, indexed publication"},{id:"p03",t:"Documented research participation — proposal writing, data collection, or analysis"},{id:"p04",t:"Volunteering campaign #1 completed, with certificate"},{id:"p05",t:"Volunteering campaign #2 completed, with certificate"},{id:"p06",t:"Six or more months of documented clinical experience in neurosurgery"},{id:"p07",t:"BLS and ACLS current"},{id:"p08",t:"ATLS completed"},{id:"p09",t:"Two or three strong, specific letters from neurosurgery consultants"},{id:"p10",t:"ORCID iD created and a CV kept continuously updated"}],V=[{when:"Aug 2026",what:"Final year begins · Phase 1 starts · mentor outreach",tag:"now"},{when:"~Jan 2027",what:"4th neurosurgery elective · IRB submission · letter request",tag:"fixed"},{when:"~Feb 2027",what:"SANS 2027 abstract deadline (2026 deadline was 5 February)",tag:"verify"},{when:"~Apr 2027",what:"SANS 2027 annual meeting (2026 was 3–5 April, Jeddah)",tag:"verify"},{when:"Spring 2027",what:"Earliest realistic SLE attempt if eligible as a final-year student",tag:"decision"},{when:"~Jun/Jul 2027",what:"Graduation",tag:""},{when:"Jul 2027",what:"Internship begins · exam preparation becomes the priority",tag:""},{when:"Autumn 2027",what:"Last safe SLE window allowing a retake before applications",tag:"critical"},{when:"~Jan 2028",what:"Saudi Board application deadline (2026 cycle closed 28 January)",tag:"verify"},{when:"~Apr–May 2028",what:"Interview period",tag:""},{when:"~Jun 2028",what:"Final admission results",tag:""}],F=[{group:"Principles of Surgery",pct:50,items:[{t:"Fluids, electrolytes & acid–base",p:10},{t:"Shock & haemostasis",p:10},{t:"Surgical infections & antibiotics",p:10},{t:"Perioperative & surgical critical care",p:10},{t:"Wounds & wound healing",p:10}]},{group:"Basic Principles of Neuroscience",pct:30,items:[{t:"Neuroanatomy",p:10},{t:"Neurological examination skills",p:10},{t:"Neurophysiology",p:5},{t:"Neurochemistry & pharmacology",p:5}]},{group:"Basic Principles of Neurosurgery",pct:20,items:[{t:"Raised ICP, cerebral oedema & herniation",p:10},{t:"Hydrocephalus & basic approaches",p:5},{t:"Neurotrauma",p:5}]}],_={1:[{id:"w1d1q1",d:1,q:"A 34-year-old man is struck across the bridge of the nose. He reports that food has lost its taste and clear fluid drips from his nose when he leans forward. Which structure has most likely been disrupted?",o:["Cribriform plate of the ethmoid","Optic canal","Foramen rotundum","Frontal sinus posterior wall"],a:0,e:"Olfactory fibres pass through the cribriform plate; shearing there causes anosmia (perceived as loss of taste, since flavour is largely olfactory) and CSF rhinorrhoea because the dura is tightly adherent and tears with the bone. This is the classic anterior fossa fracture presentation."},{id:"w1d1q2",d:1,q:"Which bone forms the roof of the orbit and the floor of the anterior cranial fossa?",o:["Orbital plate of the frontal bone","Greater wing of sphenoid","Lamina papyracea of ethmoid","Zygomatic bone"],a:0,e:"The orbital plate of the frontal bone is the shared boundary — thin enough that orbital roof fractures communicate directly with the anterior fossa, and the reason frontal craniotomies can enter the orbit inadvertently."},{id:"w1d1q3",d:1,q:"The crista galli serves as the attachment point for which structure?",o:["Falx cerebri","Tentorium cerebelli","Diaphragma sellae","Falx cerebelli"],a:0,e:"The falx cerebri attaches anteriorly to the crista galli and posteriorly to the internal occipital protuberance. Its free inferior edge lies above the corpus callosum — the gap that permits subfalcine herniation."},{id:"w1d1q4",d:1,q:"The anterior cranial fossa is separated from the middle cranial fossa by which landmark?",o:["Lesser wing of the sphenoid and the anterior clinoid processes","Petrous ridge","Greater wing of the sphenoid","Planum sphenoidale"],a:0,e:"The posterior free edge of the lesser wing (the sphenoid ridge) ending in the anterior clinoid process marks the boundary. The petrous ridge separates middle from posterior fossa — a common confusion worth fixing now."},{id:"w1d1q5",d:1,q:"Which structure lies immediately deep to the planum sphenoidale?",o:["Optic chiasm and pituitary stalk region","Cavernous sinus","Basilar artery","Trigeminal ganglion"],a:0,e:"The planum sphenoidale is the flat bone between the cribriform plate and the tuberculum sellae. The chiasmatic sulcus and optic chiasm sit just behind it — which is why planum meningiomas present with visual field loss."},{id:"w1d2q1",d:2,q:"Which nerve passes through the foramen rotundum?",o:["Maxillary division of the trigeminal (V2)","Ophthalmic division (V1)","Mandibular division (V3)","Facial nerve"],a:0,e:"Rotundum carries V2 only. A useful mnemonic chain: rotundum = V2, ovale = V3 (plus lesser petrosal and accessory meningeal artery), spinosum = middle meningeal artery. V1 does not use a round or oval foramen — it enters via the superior orbital fissure."},{id:"w1d2q2",d:2,q:"The middle meningeal artery enters the cranial cavity through which foramen?",o:["Foramen spinosum","Foramen ovale","Foramen lacerum","Carotid canal"],a:0,e:"Foramen spinosum transmits the middle meningeal artery (a branch of the maxillary artery) and the meningeal branch of V3. Its laceration at the pterion is the classic source of extradural haematoma."},{id:"w1d2q3",d:2,q:"Which of the following passes through the foramen ovale?",o:["Mandibular division of the trigeminal (V3)","Middle meningeal artery","Maxillary division (V2)","Internal carotid artery"],a:0,e:"Ovale transmits V3, the lesser petrosal nerve and the accessory meningeal artery. Clinically it matters because percutaneous approaches to the trigeminal ganglion for trigeminal neuralgia are made through foramen ovale."},{id:"w1d2q4",d:2,q:"What structure passes through the foramen lacerum in the living skull?",o:["Nothing passes vertically through it — the internal carotid crosses its superior aspect","The internal carotid artery passes vertically through it","The greater petrosal nerve alone","The mandibular nerve"],a:0,e:"A classic exam trap. Foramen lacerum is filled with cartilage in life. The ICA exits the carotid canal and travels horizontally *above* the lacerum before turning up into the cavernous sinus; it does not pass through it. The nerve of the pterygoid canal (Vidian) does traverse it."},{id:"w1d2q5",d:2,q:"A patient develops numbness of the chin and lower lip after a mandibular metastasis. Which foramen is involved?",o:["Mental foramen (via the inferior alveolar canal, from foramen ovale)","Foramen rotundum","Infraorbital foramen","Stylomastoid foramen"],a:0,e:"'Numb chin syndrome' follows the inferior alveolar branch of V3, which exits at the mental foramen. It is a recognised red flag for malignancy and traces back proximally to V3 at foramen ovale."},{id:"w1d3q1",d:3,q:"Which two structures pass through the optic canal?",o:["Optic nerve and ophthalmic artery","Optic nerve and oculomotor nerve","Ophthalmic artery and superior ophthalmic vein","Optic nerve and abducens nerve"],a:0,e:"Optic canal = CN II + ophthalmic artery (a branch of the internal carotid, running inferolateral to the nerve). Everything else entering the orbit from the middle fossa goes via the superior orbital fissure."},{id:"w1d3q2",d:3,q:"Which nerve does NOT pass through the superior orbital fissure?",o:["Optic nerve (II)","Oculomotor nerve (III)","Trochlear nerve (IV)","Abducens nerve (VI)"],a:0,e:"The superior orbital fissure carries III, IV, VI, all three branches of V1 (frontal, lacrimal, nasociliary) and the superior ophthalmic vein. CN II has its own canal — the distinction underpins the difference between orbital apex syndrome and superior orbital fissure syndrome."},{id:"w1d3q3",d:3,q:"A patient has ophthalmoplegia, ptosis, a fixed dilated pupil and forehead numbness, but normal visual acuity. Where is the lesion?",o:["Superior orbital fissure","Orbital apex","Cavernous sinus with carotid involvement","Optic canal"],a:0,e:"Superior orbital fissure syndrome affects III, IV, VI and V1 while sparing CN II, so acuity is preserved. If acuity is also lost, the optic canal is involved too and it becomes orbital apex syndrome — the single distinguishing feature is vision."},{id:"w1d3q4",d:3,q:"The inferior orbital fissure principally communicates the orbit with which space?",o:["Pterygopalatine and infratemporal fossae","Middle cranial fossa","Nasal cavity","Anterior cranial fossa"],a:0,e:"It transmits V2 (becoming the infraorbital nerve), the inferior ophthalmic vein and branches from the pterygopalatine ganglion. It is the route by which orbital floor blow-out fractures cause infraorbital numbness."},{id:"w1d3q5",d:3,q:"The common tendinous ring (annulus of Zinn) transmits which of the following?",o:["CN III, VI and the nasociliary branch of V1","CN IV and the frontal nerve","The lacrimal nerve and superior ophthalmic vein","CN II only"],a:0,e:"Passing *within* the ring: both divisions of III, VI, and nasociliary (plus optic nerve and ophthalmic artery through the adjacent optic canal). Passing *outside* it: IV, frontal and lacrimal nerves, and the superior ophthalmic vein. Explains why IV is often spared in early orbital apex lesions."},{id:"w1d4q1",d:4,q:"Which cranial nerves exit through the jugular foramen?",o:["IX, X and XI","IX and X only","X, XI and XII","VII and VIII"],a:0,e:"Glossopharyngeal, vagus and accessory. The internal jugular vein (continuing the sigmoid sinus) and the inferior petrosal sinus also pass here. Their combined injury produces Vernet syndrome."},{id:"w1d4q2",d:4,q:"A glomus jugulare tumour produces hoarseness, dysphagia, loss of gag reflex and trapezius weakness. What is this called?",o:["Vernet syndrome (jugular foramen syndrome)","Collet–Sicard syndrome","Villaret syndrome","Tapia syndrome"],a:0,e:"Vernet = IX, X, XI. Add XII and it becomes Collet–Sicard; add sympathetic chain and Horner's and it is Villaret. Recognising the pattern localises the lesion to the jugular foramen without imaging."},{id:"w1d4q3",d:4,q:"The hypoglossal nerve exits the skull through which structure?",o:["Hypoglossal canal","Jugular foramen","Foramen magnum","Stylomastoid foramen"],a:0,e:"CN XII has its own canal in the occipital bone, anterolateral to the foramen magnum. A unilateral XII lesion causes tongue deviation *towards* the side of the lesion on protrusion."},{id:"w1d4q4",d:4,q:"Which of these passes through the foramen magnum?",o:["Vertebral arteries, spinal roots of CN XI, and the medulla","Internal carotid arteries","Cranial nerves IX–XI","Sigmoid sinus"],a:0,e:"The medulla–cervical cord junction, both vertebral arteries, the anterior and posterior spinal arteries, and the spinal roots of the accessory nerve ascending to join the cranial roots. Tonsillar herniation through it compresses the medulla — the terminal event in raised ICP."},{id:"w1d4q5",d:4,q:"Which foramen transmits the facial nerve as it exits the skull?",o:["Stylomastoid foramen","Internal acoustic meatus","Jugular foramen","Foramen ovale"],a:0,e:"CN VII enters at the internal acoustic meatus with CN VIII, travels through the facial canal in the petrous temporal bone giving off greater petrosal, stapedial and chorda tympani branches, and exits at the stylomastoid foramen as pure motor supply to the face."},{id:"w1d5q1",d:5,q:"Which cranial nerve lies WITHIN the cavernous sinus rather than in its lateral wall?",o:["Abducens (VI)","Oculomotor (III)","Trochlear (IV)","Ophthalmic division (V1)"],a:0,e:"CN VI runs free within the sinus alongside the carotid; III, IV, V1 and V2 are embedded in the lateral wall. This is why a raised-ICP or cavernous lesion often produces an isolated VI palsy first — it is the most exposed."},{id:"w1d5q2",d:5,q:"A patient has proptosis, chemosis, an audible bruit and ophthalmoplegia after head trauma. What is the diagnosis?",o:["Carotid–cavernous fistula","Orbital cellulitis","Cavernous sinus thrombosis","Retrobulbar haematoma"],a:0,e:"A direct carotid–cavernous fistula shunts arterial blood into the cavernous sinus, reversing flow in the superior ophthalmic vein. The bruit and pulsatile proptosis distinguish it from infection or thrombosis."},{id:"w1d5q3",d:5,q:"Meckel's cave contains which structure?",o:["The trigeminal ganglion","The geniculate ganglion","The pterygopalatine ganglion","The ciliary ganglion"],a:0,e:"Meckel's cave is a dural pouch on the anterior petrous apex housing the trigeminal (Gasserian) ganglion, surrounded by CSF continuous with the posterior fossa. Trigeminal schwannomas classically expand it into a dumbbell shape across the petrous ridge."},{id:"w1d5q4",d:5,q:"Gradenigo syndrome (petrous apicitis) classically causes which triad?",o:["Otitis media, deep facial pain (V1) and abducens palsy","Hearing loss, facial palsy and vertigo","Ptosis, miosis and anhidrosis","Hoarseness, dysphagia and tongue deviation"],a:0,e:"Infection at the petrous apex irritates the trigeminal ganglion in Meckel's cave and CN VI in Dorello's canal, which run adjacent to it. Rare now, but a favourite exam item because it demonstrates petrous apex relations."},{id:"w1d5q5",d:5,q:"The internal carotid artery enters the skull base through which opening?",o:["Carotid canal in the petrous temporal bone","Foramen lacerum","Jugular foramen","Foramen spinosum"],a:0,e:"It enters the carotid canal, turns anteromedially through the petrous bone, crosses above the cartilage-filled foramen lacerum, then ascends into the cavernous sinus. Knowing this sequence is the basis of the ICA segment classification you will meet later."},{id:"w1d6q1",d:6,q:"A patient has periorbital bruising confined to the orbital rims after head injury without direct orbital trauma. What does this suggest?",o:["Anterior cranial fossa base-of-skull fracture","Middle cranial fossa fracture","Posterior fossa fracture","Le Fort II fracture"],a:0,e:"'Raccoon eyes' (periorbital ecchymosis) indicate anterior fossa floor fracture with blood tracking into periorbital tissues. Battle's sign — mastoid bruising — suggests a middle fossa/petrous fracture and typically appears 12–24 hours later."},{id:"w1d6q2",d:6,q:"Clear fluid from the ear after a temporal bone fracture is best confirmed as CSF by which test?",o:["Beta-2 transferrin assay","Glucose dipstick of the fluid","Halo/ring sign on gauze","Sodium concentration"],a:0,e:"Beta-2 transferrin is found essentially only in CSF, perilymph and vitreous, making it the confirmatory test. Glucose dipsticks and the halo sign are unreliable and should not decide management."},{id:"w1d6q3",d:6,q:"The pterion is a surgically important landmark because it overlies which structure?",o:["The anterior branch of the middle meningeal artery","The transverse sinus","The Sylvian fissure only","The superior sagittal sinus"],a:0,e:"The pterion is the junction of frontal, parietal, temporal and greater wing of sphenoid — the thinnest part of the lateral skull. The anterior division of the middle meningeal artery grooves the bone beneath it, so fracture here causes extradural haematoma. It is also the keyhole for the standard pterional craniotomy."},{id:"w1d6q4",d:6,q:"Which fracture pattern of the temporal bone most commonly causes immediate facial nerve palsy?",o:["Transverse","Longitudinal","Oblique","Comminuted vault"],a:0,e:"Transverse fractures cross the petrous axis and injure the facial canal and otic capsule — higher rate of immediate complete facial palsy and sensorineural hearing loss. Longitudinal fractures are commoner overall but cause conductive loss and delayed, usually recovering, palsy."},{id:"w1d6q5",d:6,q:"A tumour eroding the clivus is most likely to first affect which cranial nerve?",o:["Abducens (VI)","Oculomotor (III)","Facial (VII)","Optic (II)"],a:0,e:"CN VI has the longest intracranial course and ascends the clivus before entering Dorello's canal, making it vulnerable to clival chordoma, raised ICP and clival fracture. An isolated VI palsy is famously a false localising sign."},{id:"w1d7q1",d:7,q:"Match: which foramen transmits the greater petrosal nerve on its way to the pterygopalatine ganglion?",o:["It exits the hiatus of the facial canal and traverses foramen lacerum as the Vidian nerve","Foramen ovale","Foramen spinosum","Jugular foramen"],a:0,e:"The greater petrosal nerve (parasympathetic from VII) emerges at the facial hiatus, joins the deep petrosal nerve to form the nerve of the pterygoid canal (Vidian), and crosses foramen lacerum to reach the pterygopalatine ganglion — supplying the lacrimal gland."},{id:"w1d7q2",d:7,q:"Which single foramen would you divide to decompress the trigeminal ganglion percutaneously?",o:["Foramen ovale","Foramen rotundum","Foramen spinosum","Superior orbital fissure"],a:0,e:"Percutaneous procedures for trigeminal neuralgia — glycerol rhizolysis, balloon compression, radiofrequency — all pass a needle through foramen ovale into Meckel's cave under fluoroscopy."},{id:"w1d7q3",d:7,q:"Which structures form the boundaries of the internal acoustic meatus contents?",o:["CN VII, CN VIII and the labyrinthine artery","CN VII, VIII and IX","CN VIII and the AICA only","CN VII and the greater petrosal nerve"],a:0,e:"The IAM carries facial and vestibulocochlear nerves plus the labyrinthine (internal auditory) artery, usually a branch of AICA. A vestibular schwannoma expanding here compresses VII before it compresses the brainstem — hence early hearing loss with late facial weakness."},{id:"w1d7q4",d:7,q:"Which of the following correctly pairs a foramen with its contents?",o:["Foramen spinosum — middle meningeal artery","Foramen rotundum — V3","Jugular foramen — CN XII","Optic canal — CN III"],a:0,e:"Spinosum carries the middle meningeal artery. Rotundum is V2, not V3; XII has its own hypoglossal canal; and the optic canal carries II with the ophthalmic artery. Build a one-page table of these and revisit it weekly."},{id:"w1d7q5",d:7,q:"You are asked in theatre why a far-lateral approach requires attention to the condylar region. What is the key structure?",o:["The vertebral artery entering the dura, and the hypoglossal canal","The sigmoid sinus","The jugular bulb only","The internal carotid artery"],a:0,e:"The far-lateral approach removes part of the occipital condyle to reach the anterolateral foramen magnum. The vertebral artery courses over the C1 arch and pierces the dura here, and the hypoglossal canal runs through the condyle — both are at risk. This is the practical payoff of learning skull base osteology."}],2:[{id:"w2d1q1",d:1,q:"A 58-year-old woman has progressive anosmia, ipsilateral optic atrophy and contralateral papilloedema. What is this syndrome and its usual cause?",o:["Foster Kennedy syndrome — olfactory groove or sphenoid wing meningioma","Parinaud syndrome — pineal tumour","Gradenigo syndrome — petrous apicitis","Weber syndrome — midbrain infarct"],a:0,e:"A slow frontal mass compresses the ipsilateral olfactory tract and optic nerve (causing anosmia and atrophy) while raising ICP enough to produce papilloedema on the unaffected side. Olfactory groove meningioma is the classic cause."},{id:"w2d1q2",d:1,q:"The olfactory nerve is unusual among cranial nerves because:",o:["It is an outgrowth of the telencephalon and myelinated by oligodendrocytes, not Schwann cells","It carries motor as well as sensory fibres","It synapses in the thalamus before the cortex","It decussates completely at the chiasm"],a:0,e:"CN I (and CN II) are CNS tracts rather than true peripheral nerves. Notably, olfaction is the only sensory modality that reaches cortex without an obligatory thalamic relay — it projects directly to the piriform cortex."},{id:"w2d1q3",d:1,q:"Which visual field defect results from a lesion of the optic chiasm?",o:["Bitemporal hemianopia","Homonymous hemianopia","Monocular blindness","Binasal hemianopia"],a:0,e:"Nasal retinal fibres (carrying temporal fields) decussate at the chiasm. Compression from below — most often a pituitary macroadenoma — hits these crossing fibres first, classically starting in the superior temporal quadrants."},{id:"w2d1q4",d:1,q:"A patient has a right homonymous hemianopia with macular sparing. Where is the lesion most likely?",o:["Left occipital cortex","Left optic tract","Optic chiasm","Right optic nerve"],a:0,e:"Homonymous means retrochiasmal and contralateral to the field loss. Macular sparing points to occipital cortex, where the macular representation at the occipital pole has dual supply from PCA and MCA collaterals."},{id:"w2d1q5",d:1,q:"A lesion of Meyer's loop produces which defect?",o:["Contralateral superior quadrantanopia ('pie in the sky')","Contralateral inferior quadrantanopia","Bitemporal hemianopia","Central scotoma"],a:0,e:"Meyer's loop carries inferior retinal fibres (superior visual field) forward into the temporal lobe before turning back to the occipital cortex. Anterior temporal lobectomy for epilepsy risks exactly this defect — a standard consent point."},{id:"w2d2q1",d:2,q:"A patient with a posterior communicating artery aneurysm develops a dilated pupil and ptosis. Why is the pupil involved early?",o:["Parasympathetic fibres run superficially in the nerve and are compressed first","Parasympathetic fibres are the most metabolically active","The pupil is supplied by CN II","Sympathetic fibres are damaged first"],a:0,e:"The pupilloconstrictor fibres travel on the dorsomedial surface of CN III. Compressive lesions (aneurysm, uncal herniation) affect them early — a 'surgical' third. Ischaemic lesions such as diabetic microvascular palsy damage the core and typically spare the pupil."},{id:"w2d2q2",d:2,q:"Which extraocular muscles are NOT supplied by the oculomotor nerve?",o:["Superior oblique and lateral rectus","Medial rectus and inferior oblique","Superior rectus and levator palpebrae","Inferior rectus and inferior oblique"],a:0,e:"'LR6 SO4' — lateral rectus by abducens (VI), superior oblique by trochlear (IV), everything else including levator palpebrae superioris by CN III."},{id:"w2d2q3",d:2,q:"The classic eye position in a complete third nerve palsy is:",o:["'Down and out' with ptosis and a dilated pupil","'Up and in' with miosis","Adducted and depressed","Normal position with isolated ptosis"],a:0,e:"With III out, the unopposed lateral rectus (VI) abducts and the superior oblique (IV) depresses and intorts — hence down and out. Ptosis follows levator paralysis and mydriasis follows parasympathetic loss."},{id:"w2d2q4",d:2,q:"A midbrain infarct causes ipsilateral third nerve palsy with contralateral hemiparesis. Name the syndrome.",o:["Weber syndrome","Benedikt syndrome","Millard–Gubler syndrome","Wallenberg syndrome"],a:0,e:"Weber = CN III fascicle plus cerebral peduncle (corticospinal tract). Benedikt adds red nucleus involvement with contralateral tremor/ataxia. Both illustrate the crossed pattern: cranial nerve ipsilateral, long tracts contralateral."},{id:"w2d2q5",d:2,q:"In uncal herniation, why does the ipsilateral pupil dilate before hemiparesis develops?",o:["The uncus compresses CN III against the tentorial edge before the peduncle is involved","The pupil is more sensitive to hypoxia","The optic nerve is compressed first","Sympathetic overdrive occurs first"],a:0,e:"The medial temporal lobe herniates over the tentorial incisura, catching CN III as it runs between PCA and superior cerebellar artery. A blown pupil in a deteriorating head injury is therefore an emergency indicating imminent brainstem compression."},{id:"w2d3q1",d:3,q:"Which cranial nerve is the only one to exit the brainstem dorsally?",o:["Trochlear (IV)","Abducens (VI)","Trigeminal (V)","Facial (VII)"],a:0,e:"CN IV exits dorsally just below the inferior colliculi and decussates before doing so — so it is also the only cranial nerve that innervates a contralateral structure. Both facts make it uniquely vulnerable in dorsal midbrain surgery and in trauma."},{id:"w2d3q2",d:3,q:"A patient reports vertical diplopia worse on looking down and to the left, and tilts the head to the right. Which nerve is affected?",o:["Left trochlear nerve","Right trochlear nerve","Left oculomotor nerve","Right abducens nerve"],a:0,e:"The superior oblique depresses the adducted eye and intorts. Left SO palsy gives worst diplopia looking down-and-in for the left eye (i.e. down and right), and patients tilt the head *away* from the affected side to compensate — the Bielschowsky test formalises this."},{id:"w2d3q3",d:3,q:"Why is an isolated abducens palsy considered a 'false localising sign' in raised intracranial pressure?",o:["Its long intracranial course over the petrous ridge makes it vulnerable regardless of where the mass is","It is compressed by the falx","It is the most metabolically active nerve","It shares a blood supply with the optic nerve"],a:0,e:"CN VI travels a long distance from the pontomedullary junction, up the clivus, through Dorello's canal under the petroclinoid ligament, into the cavernous sinus. Downward brain displacement stretches it. It tells you pressure is raised, not where the lesion is."},{id:"w2d3q4",d:3,q:"A pontine lesion causes ipsilateral lateral rectus palsy, ipsilateral facial weakness and contralateral hemiparesis. What is this?",o:["Millard–Gubler syndrome","Weber syndrome","Foville syndrome","Wallenberg syndrome"],a:0,e:"Ventral pontine lesion involving the VI and VII fascicles plus the corticospinal tract. Foville adds a horizontal gaze palsy from PPRF involvement. Note again the crossed pattern that localises brainstem lesions."},{id:"w2d3q5",d:3,q:"Internuclear ophthalmoplegia (impaired adduction with nystagmus of the abducting eye) results from a lesion of:",o:["The medial longitudinal fasciculus","CN III nucleus","CN VI nucleus","The paramedian pontine reticular formation"],a:0,e:"The MLF connects the abducens nucleus to the contralateral oculomotor nucleus for conjugate horizontal gaze. Convergence is preserved, which distinguishes INO from a true third nerve palsy. Bilateral INO in a young patient suggests multiple sclerosis."},{id:"w2d4q1",d:4,q:"The corneal reflex tests which nerves?",o:["V1 afferent, VII efferent","V2 afferent, VII efferent","II afferent, III efferent","V1 afferent, III efferent"],a:0,e:"Sensation from the cornea travels via the nasociliary branch of V1; the blink is orbicularis oculi via CN VII. Loss of the reflex with intact facial movement is an early sign in vestibular schwannoma as the tumour enlarges to touch V."},{id:"w2d4q2",d:4,q:"Which muscles does the trigeminal nerve innervate?",o:["Muscles of mastication, tensor tympani, tensor veli palatini, mylohyoid and anterior digastric","Muscles of facial expression","Stylopharyngeus","Stapedius"],a:0,e:"V3 is the only motor division. Note the odd ones: tensor tympani (V3) versus stapedius (VII), and tensor veli palatini (V3) versus all other palatal muscles (X). These pairs are exam staples."},{id:"w2d4q3",d:4,q:"Classical trigeminal neuralgia is most often caused by:",o:["Neurovascular compression at the root entry zone, usually by the superior cerebellar artery","Demyelination of the trigeminal nucleus","Compression by AICA in the internal acoustic meatus","Herpes zoster reactivation"],a:0,e:"A vessel — most often SCA — pulsates against the root entry zone where central myelin transitions to peripheral, causing ephaptic transmission. Microvascular decompression addresses the cause; percutaneous procedures and radiosurgery are lesional alternatives."},{id:"w2d4q4",d:4,q:"The spinal trigeminal nucleus extends caudally as far as:",o:["The upper cervical cord (C2–C3)","The pontomedullary junction","The midbrain","The thoracic cord"],a:0,e:"It carries pain and temperature and descends to upper cervical levels — which is why facial pain can arise from high cervical pathology, and why lateral medullary (Wallenberg) infarcts cause *ipsilateral* facial pain/temperature loss with contralateral body loss."},{id:"w2d4q5",d:4,q:"A patient has loss of pain and temperature over the face in an 'onion-skin' distribution. Where is the lesion?",o:["Spinal trigeminal nucleus (rostrocaudal somatotopy)","Trigeminal ganglion","Peripheral V2 branch","Thalamus"],a:0,e:"The spinal trigeminal nucleus is organised with perioral regions represented rostrally and peripheral face caudally — the Dejerine onion-skin pattern. A concentric rather than dermatomal loss therefore indicates a central brainstem lesion."},{id:"w2d5q1",d:5,q:"A relative afferent pupillary defect (Marcus Gunn pupil) indicates a lesion where?",o:["Optic nerve or extensive retinal disease on the affected side","Oculomotor nerve","Sympathetic chain","Midbrain pretectal area"],a:0,e:"In the swinging flashlight test the affected pupil paradoxically dilates when light moves to it, because afferent input is reduced. It is a defect of input, so efferent (III) function and pupil size at rest are normal."},{id:"w2d5q2",d:5,q:"Light–near dissociation with bilateral small irregular pupils that accommodate but do not react to light describes:",o:["Argyll Robertson pupils","Adie's tonic pupil","Horner syndrome","Third nerve palsy"],a:0,e:"Classically neurosyphilis. The pretectal light reflex pathway is interrupted while the more ventral near-response pathway is spared. Adie's pupil, by contrast, is usually unilateral, large, and shows slow tonic constriction with denervation supersensitivity to dilute pilocarpine."},{id:"w2d5q3",d:5,q:"Horner syndrome consists of:",o:["Ptosis, miosis and anhidrosis, sometimes with apparent enophthalmos","Ptosis, mydriasis and ophthalmoplegia","Proptosis, chemosis and bruit","Ptosis with normal pupils"],a:0,e:"Interruption of the three-neuron oculosympathetic pathway. Ptosis is partial (Müller's muscle, not levator), distinguishing it from third nerve palsy where ptosis is complete and the pupil is dilated."},{id:"w2d5q4",d:5,q:"A patient with a painful Horner syndrome and neck pain after a whiplash injury most likely has:",o:["Internal carotid artery dissection","Pancoast tumour","Lateral medullary infarct","Cluster headache"],a:0,e:"The sympathetic fibres travel on the carotid adventitia; dissection stretches them, sparing sweating of the face (the sudomotor fibres follow the external carotid). Painful Horner's is a stroke warning and needs urgent vascular imaging."},{id:"w2d5q5",d:5,q:"Parinaud syndrome — upgaze palsy, convergence–retraction nystagmus and light–near dissociation — localises to:",o:["The dorsal midbrain / pretectal region","The pons","The medulla","The cavernous sinus"],a:0,e:"Classically a pineal region tumour compressing the pretectum, or hydrocephalus dilating the third ventricle. In a child with a pineal mass, upgaze palsy plus headache is a neurosurgical presentation you should recognise instantly."},{id:"w2d6q1",d:6,q:"A pituitary macroadenoma extends laterally and the patient develops diplopia. Which nerve is most likely affected first?",o:["Abducens (VI), free within the cavernous sinus","Oculomotor (III)","Trochlear (IV)","Optic (II)"],a:0,e:"Nerves in the lateral wall (III, IV, V1, V2) are relatively protected by dura; VI floats free adjacent to the carotid and is hit first by lateral extension. Superior extension instead compresses the chiasm and gives bitemporal hemianopia."},{id:"w2d6q2",d:6,q:"Pituitary apoplexy typically presents with:",o:["Sudden headache, visual loss, ophthalmoplegia and hypopituitarism","Gradual bitemporal field loss alone","Isolated galactorrhoea","Painless progressive ptosis"],a:0,e:"Haemorrhage or infarction into an adenoma expands it acutely. It is a neurosurgical and endocrine emergency: give steroids for adrenal insufficiency first, then decide on urgent transsphenoidal decompression based on vision."},{id:"w2d6q3",d:6,q:"Which finding best distinguishes a compressive from an ischaemic third nerve palsy at the bedside?",o:["Pupil involvement","Degree of ptosis","Presence of pain","Age of the patient"],a:0,e:"Pupil-involving means compressive until proven otherwise and mandates urgent angiography for a posterior communicating aneurysm. Pupil-sparing with pain in a diabetic is usually microvascular — but a partial palsy is unreliable and should still be imaged."},{id:"w2d6q4",d:6,q:"Bilateral papilloedema with a normal MRI brain and raised opening pressure on lumbar puncture suggests:",o:["Idiopathic intracranial hypertension","Optic neuritis","Pseudopapilloedema from drusen","Malignant hypertension"],a:0,e:"IIH classically affects young women with obesity, causing headache, visual obscurations and often a sixth nerve palsy as a false localising sign. Venography is needed to exclude venous sinus thrombosis before calling it idiopathic."},{id:"w2d6q5",d:6,q:"Which cranial nerve deficit would you specifically test before and after a transsphenoidal pituitary operation?",o:["Visual fields and acuity (CN II), plus CN III, IV and VI","CN VII and VIII","CN IX, X and XI","CN XII alone"],a:0,e:"Chiasmal decompression is the point of the operation, so documented preoperative fields are essential. Cavernous sinus nerves are at risk laterally. Documenting these before theatre protects the patient and you."},{id:"w2d7q1",d:7,q:"Which nucleus supplies the parasympathetic component of CN III?",o:["Edinger–Westphal nucleus","Superior salivatory nucleus","Inferior salivatory nucleus","Dorsal motor nucleus of the vagus"],a:0,e:"Edinger–Westphal → ciliary ganglion → short ciliary nerves → sphincter pupillae and ciliary muscle. Superior salivatory belongs to VII (lacrimal, submandibular), inferior salivatory to IX (parotid), dorsal motor to X."},{id:"w2d7q2",d:7,q:"A lesion of the optic tract produces which defect?",o:["Contralateral homonymous hemianopia, usually incongruous","Bitemporal hemianopia","Ipsilateral monocular loss","Superior quadrantanopia"],a:0,e:"Post-chiasmal lesions give homonymous defects. The more anterior the lesion, the more incongruous (less well matched between the two eyes); occipital lesions are highly congruous. Congruity is your localising clue."},{id:"w2d7q3",d:7,q:"The afferent limb of the jaw jerk reflex travels via:",o:["The mesencephalic nucleus of the trigeminal nerve","The spinal trigeminal nucleus","The main sensory nucleus of V","The trigeminal motor nucleus"],a:0,e:"The mesencephalic nucleus is unique — it contains primary sensory neuron cell bodies inside the CNS, carrying proprioception from the muscles of mastication. A brisk jaw jerk suggests an upper motor neuron lesion above the pons."},{id:"w2d7q4",d:7,q:"Which combination indicates a cavernous sinus syndrome rather than an orbital apex syndrome?",o:["III, IV, VI and V1/V2 involvement with preserved visual acuity","Visual loss with ophthalmoplegia","Isolated visual field loss","Facial weakness with hearing loss"],a:0,e:"Cavernous sinus lesions can involve V2 (which passes through it) and typically spare CN II. Orbital apex lesions involve the optic nerve, so acuity drops. V2 involvement plus normal vision therefore points posteriorly to the sinus."},{id:"w2d7q5",d:7,q:"In a comatose patient, absent oculocephalic ('doll's eye') responses with intact pupils suggests:",o:["Brainstem dysfunction involving the vestibulo-ocular pathways","Cortical blindness","Bilateral optic neuropathy","Peripheral vestibular failure alone"],a:0,e:"The reflex arc runs vestibular nuclei → MLF → III and VI nuclei. Its loss implies brainstem involvement and carries poor prognostic weight. Never perform it before the cervical spine is cleared in trauma — use cold caloric testing instead."}],3:[{id:"w3d1q1",d:1,q:"In order from proximal to distal, which branches leave the facial nerve within the temporal bone?",o:["Greater petrosal, nerve to stapedius, chorda tympani","Chorda tympani, greater petrosal, nerve to stapedius","Nerve to stapedius, chorda tympani, greater petrosal","Greater petrosal, chorda tympani, nerve to stapedius"],a:0,e:"Greater petrosal (lacrimation) at the geniculate ganglion, then nerve to stapedius, then chorda tympani (taste to anterior two-thirds of tongue and submandibular secretion). Which branches are affected localises the lesion along the canal — the basis of topognostic testing."},{id:"w3d1q2",d:1,q:"A patient with facial weakness also has hyperacusis and loss of taste on the anterior tongue, but normal lacrimation. Where is the lesion?",o:["Distal to the geniculate ganglion but proximal to the stapedial branch","Proximal to the geniculate ganglion","At the stylomastoid foramen","In the parotid gland"],a:0,e:"Preserved lacrimation places the lesion beyond the greater petrosal nerve. Hyperacusis means stapedius is affected and altered taste means chorda tympani is affected, so the lesion sits between geniculate ganglion and the stapedial branch."},{id:"w3d1q3",d:1,q:"The five terminal branches of the facial nerve within the parotid are:",o:["Temporal, zygomatic, buccal, marginal mandibular, cervical","Temporal, zygomatic, buccal, lingual, cervical","Frontal, orbital, nasal, oral, cervical","Temporal, maxillary, mandibular, buccal, cervical"],a:0,e:"'Ten Zebras Bit My Cheek.' The nerve divides at the pes anserinus within the parotid, which is why parotid surgery risks facial palsy and why parotid tumours can present with facial weakness — a sign suggesting malignancy."},{id:"w3d1q4",d:1,q:"The nervus intermedius carries which fibres?",o:["Parasympathetic, taste and some somatic sensory fibres of CN VII","Pure motor fibres to the face","Auditory fibres","Sympathetic fibres to the orbit"],a:0,e:"CN VII has two roots: the large motor root and the nervus intermedius (of Wrisberg) carrying parasympathetic and special sensory (taste) fibres. Geniculate neuralgia — deep ear pain — is attributed to this branch."},{id:"w3d1q5",d:1,q:"Which muscle does the facial nerve NOT supply?",o:["Levator palpebrae superioris","Orbicularis oculi","Stapedius","Posterior belly of digastric"],a:0,e:"Levator palpebrae superioris is CN III (with sympathetic Müller's muscle). CN VII supplies orbicularis oculi — hence in facial palsy the patient cannot *close* the eye, whereas in third nerve palsy they cannot *open* it."},{id:"w3d2q1",d:2,q:"A patient has weakness of the lower face but can wrinkle the forehead normally. Where is the lesion?",o:["Upper motor neuron — contralateral cortex or corticobulbar tract","Lower motor neuron — facial nucleus","Facial canal","Parotid gland"],a:0,e:"The forehead portion of the facial nucleus receives bilateral corticobulbar input, so it is spared in UMN lesions. Forehead involvement means a lower motor neuron lesion — the single most useful discriminator in facial weakness."},{id:"w3d2q2",d:2,q:"Vesicles in the external auditory canal with facial palsy and vertigo indicate:",o:["Ramsay Hunt syndrome (herpes zoster oticus)","Bell's palsy","Acoustic neuroma","Otitis externa"],a:0,e:"Varicella zoster reactivation in the geniculate ganglion. It carries a worse prognosis than Bell's palsy and warrants antivirals plus steroids. Always inspect the ear canal in any facial palsy."},{id:"w3d2q3",d:2,q:"The House–Brackmann scale is used to grade:",o:["Facial nerve function","Hearing loss","Level of consciousness","Spinal cord injury"],a:0,e:"Grades I (normal) to VI (complete paralysis). It is the standard outcome measure quoted after vestibular schwannoma and parotid surgery — worth knowing by name before any neuro-otology elective."},{id:"w3d2q4",d:2,q:"Which is the most important early management step in a patient with complete facial palsy?",o:["Eye protection — lubricants, taping at night","Immediate surgical decompression","Facial physiotherapy","Antibiotics"],a:0,e:"Exposure keratopathy from an unblinking eye can cause permanent visual loss within days. It is the intervention most often forgotten by junior staff and the one that most reliably prevents harm."},{id:"w3d2q5",d:2,q:"Bilateral facial nerve palsy should prompt consideration of:",o:["Lyme disease, sarcoidosis, Guillain–Barré syndrome or basal skull fracture","Bell's palsy","Stroke","Vestibular schwannoma"],a:0,e:"Bilateral simultaneous palsy is rarely idiopathic. Neurosarcoid (Heerfordt syndrome), neuroborreliosis, GBS and skull base trauma or malignancy should all be excluded — a systemic workup is mandatory."},{id:"w3d3q1",d:3,q:"In Rinne and Weber testing, a patient has Weber lateralising to the left with a positive Rinne bilaterally (AC > BC). What is the diagnosis?",o:["Right sensorineural hearing loss","Left conductive hearing loss","Left sensorineural hearing loss","Normal hearing"],a:0,e:"Weber lateralises *away* from a sensorineural loss and *towards* a conductive loss. Both Rinnes normal excludes conductive loss, so the lesion is a right sensorineural deficit."},{id:"w3d3q2",d:3,q:"A 45-year-old presents with progressive unilateral sensorineural hearing loss and tinnitus. What must be excluded?",o:["Vestibular schwannoma","Otosclerosis","Presbycusis","Cerumen impaction"],a:0,e:"Asymmetric sensorineural loss is a vestibular schwannoma until MRI with gadolinium proves otherwise. Presbycusis is symmetrical, otosclerosis is conductive, and wax is conductive and visible."},{id:"w3d3q3",d:3,q:"Bilateral vestibular schwannomas are pathognomonic of:",o:["Neurofibromatosis type 2","Neurofibromatosis type 1","Von Hippel–Lindau disease","Tuberous sclerosis"],a:0,e:"NF2 (merlin/NF2 gene on chromosome 22) — bilateral vestibular schwannomas plus meningiomas and ependymomas. NF1 gives optic pathway gliomas, café-au-lait macules and neurofibromas instead."},{id:"w3d3q4",d:3,q:"Why does a vestibular schwannoma usually cause hearing loss rather than vertigo despite arising from the vestibular nerve?",o:["Slow growth allows central vestibular compensation, while cochlear fibres are compressed","It arises from the cochlear nerve","Vestibular fibres are more resistant to compression","Vertigo is always present"],a:0,e:"Gradual unilateral vestibular loss is centrally compensated so patients report imbalance rather than true vertigo, whereas cochlear function degrades progressively. Acute vertigo suggests a different, faster process."},{id:"w3d3q5",d:3,q:"In cold caloric testing of a comatose patient with an intact brainstem, irrigating the left ear with cold water produces:",o:["Slow deviation of both eyes towards the left","Fast nystagmus towards the left","No response","Deviation of both eyes to the right"],a:0,e:"COWS — cold opposite, warm same — refers to the *fast* (cortical) phase, which is absent in coma. In an unconscious patient with an intact brainstem you see only the slow tonic deviation towards the cold ear. No response at all suggests brainstem failure."},{id:"w3d4q1",d:4,q:"The gag reflex has which afferent and efferent limbs?",o:["Afferent IX, efferent X","Afferent X, efferent IX","Afferent V, efferent VII","Afferent IX, efferent XII"],a:0,e:"Glossopharyngeal senses the posterior pharynx; vagus mediates the pharyngeal contraction. Note that an absent gag reflex is common in normal people and is a poor test of aspiration risk on its own."},{id:"w3d4q2",d:4,q:"Which muscle is supplied by the glossopharyngeal nerve?",o:["Stylopharyngeus","Palatoglossus","Cricothyroid","Genioglossus"],a:0,e:"Stylopharyngeus is the only motor supply of CN IX. Palatoglossus is vagus (despite the '-glossus' name), cricothyroid is the external laryngeal branch of X, and genioglossus is XII."},{id:"w3d4q3",d:4,q:"A patient is hoarse after thyroid surgery and the cord is paralysed. Which nerve was injured?",o:["Recurrent laryngeal nerve (branch of vagus)","External branch of superior laryngeal nerve","Glossopharyngeal nerve","Hypoglossal nerve"],a:0,e:"The recurrent laryngeal nerve supplies all intrinsic laryngeal muscles except cricothyroid. Injury to the external branch of the superior laryngeal nerve instead causes loss of high pitch and vocal fatigue, not a paralysed cord."},{id:"w3d4q4",d:4,q:"The uvula deviates to the right when a patient says 'ah'. Which nerve is lesioned?",o:["Left vagus","Right vagus","Left hypoglossal","Right glossopharyngeal"],a:0,e:"The intact side pulls the uvula towards itself, so the uvula deviates *away* from the lesion. Contrast with the tongue, which deviates *towards* the side of a XII lesion — a pair worth memorising together."},{id:"w3d4q5",d:4,q:"Glossopharyngeal neuralgia characteristically causes pain:",o:["In the throat, tonsillar fossa and ear, triggered by swallowing","Over the cheek, triggered by touch","Behind the eye, with autonomic features","In the occiput, triggered by neck movement"],a:0,e:"Severe lancinating pharyngeal pain radiating to the ear on swallowing or talking. It may be accompanied by syncope through vagal reflex bradycardia — a distinctive and dangerous feature not seen in trigeminal neuralgia."},{id:"w3d5q1",d:5,q:"A patient cannot shrug the right shoulder and has scapular winging worsened by abduction. Which nerve is injured?",o:["Right accessory nerve (XI)","Long thoracic nerve","Dorsal scapular nerve","Suprascapular nerve"],a:0,e:"Trapezius palsy from XI injury — commonly iatrogenic after posterior triangle lymph node biopsy, where the nerve is superficial. Long thoracic injury paralyses serratus anterior and causes winging that worsens on forward *flexion* and pushing against a wall."},{id:"w3d5q2",d:5,q:"The tongue deviates to the left on protrusion. Where is the lesion?",o:["Left hypoglossal nerve or nucleus","Right hypoglossal nerve","Left corticobulbar tract","Left vagus"],a:0,e:"Genioglossus protrudes the tongue; the intact right side pushes it across, so the tongue points *towards* the weak side. Look also for fasciculation and wasting, which confirm a lower motor neuron lesion."},{id:"w3d5q3",d:5,q:"Medial medullary syndrome produces which combination?",o:["Ipsilateral tongue weakness, contralateral hemiparesis and loss of proprioception","Ipsilateral facial numbness with contralateral body numbness","Ipsilateral Horner's with ataxia","Bilateral ptosis"],a:0,e:"Anterior spinal artery territory: XII nucleus/fascicle, pyramid and medial lemniscus. Compare with lateral medullary (Wallenberg) syndrome — spinothalamic, spinal V, nucleus ambiguus, sympathetic and inferior cerebellar peduncle."},{id:"w3d5q4",d:5,q:"The spinal root of the accessory nerve arises from which levels and enters the skull how?",o:["C1–C5/C6 anterior horn, ascending through the foramen magnum","Medulla only","C5–C7, through the jugular foramen directly","Upper thoracic cord"],a:0,e:"Spinal rootlets ascend through the foramen magnum, briefly join the cranial roots, then exit the jugular foramen to supply sternocleidomastoid and trapezius. It is the only cranial nerve to enter and exit the skull."},{id:"w3d5q5",d:5,q:"Turning the head to the left tests which muscle?",o:["Right sternocleidomastoid","Left sternocleidomastoid","Left trapezius","Right splenius capitis"],a:0,e:"SCM rotates the head to the *opposite* side while flexing it to its own side. So the right SCM turns the head left — a small point that is easy to get backwards under exam pressure."},{id:"w3d6q1",d:6,q:"Wallenberg (lateral medullary) syndrome classically includes all EXCEPT:",o:["Contralateral facial pain and temperature loss","Ipsilateral Horner syndrome","Dysphagia and hoarseness","Contralateral body pain and temperature loss"],a:0,e:"Facial sensory loss is *ipsilateral* (spinal trigeminal nucleus) while body loss is contralateral (spinothalamic tract) — the classic crossed sensory pattern. Add ipsilateral ataxia, vertigo and nucleus ambiguus involvement. Usually PICA or vertebral artery occlusion."},{id:"w3d6q2",d:6,q:"Jugular foramen syndrome with additional hypoglossal involvement is called:",o:["Collet–Sicard syndrome","Vernet syndrome","Villaret syndrome","Tapia syndrome"],a:0,e:"Vernet = IX, X, XI. Collet–Sicard = IX, X, XI, XII. Villaret = those four plus sympathetic (Horner's), implying retroparotid space involvement. The progression maps anatomical spread outward from the jugular foramen."},{id:"w3d6q3",d:6,q:"A glomus jugulare tumour arises from which tissue?",o:["Paraganglionic (glomus) cells of the jugular bulb adventitia","Schwann cells","Arachnoid cap cells","Ependymal cells"],a:0,e:"A paraganglioma — highly vascular, may be catecholamine-secreting, and shows a 'salt and pepper' appearance on MRI from flow voids. Preoperative embolisation is often used because of the bleeding risk."},{id:"w3d6q4",d:6,q:"Which cranial nerves would you specifically assess before extubating a patient after a posterior fossa operation?",o:["IX and X — swallow, cough and gag","III and IV","I and II","XI alone"],a:0,e:"Lower cranial nerve palsy means an unprotected airway and high aspiration risk. Formal swallow assessment before oral intake is a standard, frequently examined point of postoperative care."},{id:"w3d6q5",d:6,q:"Pseudobulbar palsy differs from bulbar palsy in that it features:",o:["A spastic tongue, brisk jaw jerk and emotional lability","Tongue fasciculation and wasting","Absent jaw jerk","Isolated unilateral weakness"],a:0,e:"Pseudobulbar palsy is an upper motor neuron lesion of the corticobulbar tracts bilaterally — spastic, small, immobile tongue with brisk reflexes. Bulbar palsy is lower motor neuron with a wasted fasciculating tongue and absent reflexes."},{id:"w3d7q1",d:7,q:"Which cranial nerve nucleus is shared by CN IX, X and XI (cranial part)?",o:["Nucleus ambiguus","Nucleus solitarius","Dorsal motor nucleus of the vagus","Spinal trigeminal nucleus"],a:0,e:"Nucleus ambiguus provides branchial motor output to pharynx and larynx via IX, X and the cranial accessory fibres. Nucleus solitarius receives taste and visceral afferents from VII, IX and X; the dorsal motor nucleus is parasympathetic."},{id:"w3d7q2",d:7,q:"Taste from the posterior third of the tongue is carried by:",o:["Glossopharyngeal nerve","Chorda tympani of the facial nerve","Lingual nerve of V3","Hypoglossal nerve"],a:0,e:"Anterior two-thirds taste = chorda tympani (VII); general sensation there = lingual nerve (V3). Posterior third = IX for both taste and general sensation. Epiglottis and beyond = X."},{id:"w3d7q3",d:7,q:"In the cerebellopontine angle, which nerves are most commonly involved by an expanding lesion, in order?",o:["VIII, then V and VII, then IX and X with large tumours","VII, then III, then VI","V, then XII, then XI","IX, then VIII, then IV"],a:0,e:"Hearing loss first, then corneal reflex loss (V) and facial weakness (VII), then lower cranial nerves and brainstem compression with hydrocephalus. This progression is exactly how you should present a CPA case."},{id:"w3d7q4",d:7,q:"Which pairing is INCORRECT?",o:["Stapedius — trigeminal nerve","Tensor tympani — trigeminal nerve","Stylopharyngeus — glossopharyngeal nerve","Cricothyroid — vagus nerve"],a:0,e:"Stapedius is supplied by the facial nerve, not the trigeminal. Tensor tympani and tensor veli palatini are the V3 exceptions — a pair of 'tensors' that trip people up every year."},{id:"w3d7q5",d:7,q:"A patient has hoarseness, ipsilateral Horner's, and ipsilateral loss of facial pain sensation with contralateral limb sensory loss. Which vessel is occluded?",o:["Vertebral artery or PICA","Middle cerebral artery","Anterior spinal artery","Basilar tip"],a:0,e:"This is Wallenberg syndrome. Most cases are actually vertebral artery rather than isolated PICA occlusion. Recognising the crossed sensory pattern gives you the level (medulla) and the side without imaging."}],4:[{id:"w4d1q1",d:1,q:"The cranial dura mater differs from spinal dura in that it:",o:["Has two layers — an outer periosteal and an inner meningeal layer that separate to form venous sinuses","Has only one layer","Contains no blood vessels","Is separated from bone by a true epidural space"],a:0,e:"The two cranial layers split to enclose the dural venous sinuses. Spinally there is only the meningeal layer, with a genuine fat-filled epidural space outside it — which is why epidural anaesthesia is a spinal, not a cranial, concept."},{id:"w4d1q2",d:1,q:"Which dural fold separates the cerebral hemispheres from the cerebellum?",o:["Tentorium cerebelli","Falx cerebri","Falx cerebelli","Diaphragma sellae"],a:0,e:"The tentorium divides supratentorial from infratentorial compartments. Its free edge bounds the tentorial incisura through which the midbrain passes — the aperture involved in uncal and central herniation."},{id:"w4d1q3",d:1,q:"The diaphragma sellae is pierced by which structure?",o:["The pituitary stalk (infundibulum)","The optic chiasm","The internal carotid artery","The oculomotor nerve"],a:0,e:"It roofs the sella with a central aperture for the stalk. An incompetent diaphragma allows CSF to herniate down, producing the 'empty sella' appearance often seen incidentally on MRI."},{id:"w4d1q4",d:1,q:"Which artery supplies most of the cranial dura?",o:["Middle meningeal artery","Anterior cerebral artery","Superficial temporal artery","Vertebral artery"],a:0,e:"A branch of the maxillary artery entering through foramen spinosum. Because the dura has its own arterial supply distinct from the brain, meningiomas typically show a dural blood supply and a 'dural tail' on contrast MRI."},{id:"w4d1q5",d:1,q:"Pain-sensitive intracranial structures include all of the following EXCEPT:",o:["The brain parenchyma itself","Dura at the skull base","Large arteries and venous sinuses","Cranial nerves V, IX and X"],a:0,e:"The brain has no nociceptors — which is why awake craniotomy for eloquent-area mapping is possible. Headache in intracranial disease arises from traction on dura, vessels and nerves, not from the brain tissue."},{id:"w4d2q1",d:2,q:"Place the CSF pathway in the correct order.",o:["Lateral ventricle → foramen of Monro → third ventricle → aqueduct → fourth ventricle → foramina of Luschka and Magendie","Third ventricle → foramen of Monro → lateral ventricle → aqueduct","Lateral ventricle → aqueduct → third ventricle → fourth ventricle","Fourth ventricle → aqueduct → third ventricle → Monro"],a:0,e:"Learn this as a single chain — every type of obstructive hydrocephalus is defined by which link is blocked. Colloid cyst blocks Monro; aqueduct stenosis blocks the aqueduct; posterior fossa tumour blocks the fourth ventricle outlets."},{id:"w4d2q2",d:2,q:"A colloid cyst classically sits where and causes what?",o:["At the foramen of Monro, causing bilateral lateral ventricular hydrocephalus and possible sudden death","In the fourth ventricle, causing gait ataxia","In the pineal region, causing Parinaud syndrome","In the sella, causing bitemporal hemianopia"],a:0,e:"Ball-valve obstruction of both foramina of Monro can cause acute hydrocephalus, positional headache and, rarely, sudden deterioration. It is a benign lesion with a genuinely dangerous location."},{id:"w4d2q3",d:2,q:"The floor of the fourth ventricle contains which important landmark?",o:["The facial colliculus, overlying the VII fibres looping around the VI nucleus","The habenula","The massa intermedia","The lamina terminalis"],a:0,e:"The facial colliculus is a critical safe-entry consideration in fourth ventricular floor surgery. A lesion here can produce combined VI and VII palsies, since the facial fibres loop around the abducens nucleus."},{id:"w4d2q4",d:2,q:"Which structure forms the roof of the third ventricle?",o:["Tela choroidea with the choroid plexus and internal cerebral veins","Corpus callosum","Fornix body alone","Thalamus"],a:0,e:"The tela choroidea carries the internal cerebral veins in the velum interpositum. This is why transcallosal–transventricular approaches to the third ventricle must respect the venous anatomy — injury risks venous infarction of deep structures."},{id:"w4d2q5",d:2,q:"Evans' index, used to assess ventricular size, is defined as:",o:["Maximal width of the frontal horns divided by the maximal internal skull diameter on the same axial slice","Third ventricle width divided by skull width","Fourth ventricle area divided by posterior fossa area","Lateral ventricle length divided by hemispheric length"],a:0,e:"An index above 0.3 indicates ventriculomegaly and is part of the NPH diagnostic criteria. It is quick, reproducible, and something you can calculate on a ward round to look prepared."},{id:"w4d3q1",d:3,q:"Approximately how much CSF is produced per day in an adult, and what is the total volume at any time?",o:["About 500 mL/day produced; about 150 mL total volume","About 150 mL/day; 500 mL total","About 2 L/day; 150 mL total","About 50 mL/day; 500 mL total"],a:0,e:"Roughly 0.3–0.35 mL/min, so the entire volume turns over three to four times daily. Of the 150 mL, about 25 mL is ventricular and the rest is in the subarachnoid space — figures worth memorising exactly."},{id:"w4d3q2",d:3,q:"CSF is principally produced by:",o:["The choroid plexus, via active secretion involving carbonic anhydrase and Na+/K+-ATPase","Passive filtration across the blood–brain barrier","The arachnoid granulations","The ependymal lining alone"],a:0,e:"Active secretion, which is why production is largely independent of ICP — a crucial point: raising ICP does not switch off CSF production. Acetazolamide inhibits carbonic anhydrase and modestly reduces production."},{id:"w4d3q3",d:3,q:"Normal CSF in an adult contains:",o:["0–5 white cells/mm³, protein 0.15–0.45 g/L, glucose about two-thirds of serum","20 white cells/mm³, protein 2 g/L","0 cells, protein 1.5 g/L, glucose equal to serum","50 red cells and 10 neutrophils"],a:0,e:"Any neutrophils in adult CSF are abnormal. A low glucose ratio suggests bacterial, tuberculous or fungal infection or carcinomatous meningitis; viral meningitis typically preserves glucose."},{id:"w4d3q4",d:3,q:"CSF absorption occurs mainly through:",o:["Arachnoid granulations into the dural venous sinuses, plus lymphatic pathways","The choroid plexus in reverse","The ependyma","Renal clearance"],a:0,e:"Absorption is pressure-dependent and requires a gradient between CSF and sinus pressure. Raised venous pressure (sinus thrombosis, right heart failure) impairs absorption and can raise ICP — the mechanism behind some communicating hydrocephalus."},{id:"w4d3q5",d:3,q:"Normal adult ICP measured supine is approximately:",o:["5–15 mmHg","20–30 mmHg","0–2 mmHg","30–40 mmHg"],a:0,e:"Treatment thresholds in traumatic brain injury are conventionally set around 20–22 mmHg. Note that normal values differ by age — infants are lower, and children have their own thresholds."},{id:"w4d4q1",d:4,q:"Which cistern is the largest and is commonly used for CSF access in the posterior fossa?",o:["Cisterna magna (cerebellomedullary cistern)","Interpeduncular cistern","Ambient cistern","Quadrigeminal cistern"],a:0,e:"It lies between the cerebellum and medulla, below the vermis. Cisterna magna puncture is possible but rarely used; more importantly, its effacement on CT is an early warning of posterior fossa mass effect."},{id:"w4d4q2",d:4,q:"Effacement of the basal cisterns on CT head indicates:",o:["Raised intracranial pressure with brain swelling — a poor prognostic sign","Normal variant in young patients","Chronic hydrocephalus","Cerebral atrophy"],a:0,e:"This is one of the first things to look for on any trauma CT. Compressed or absent basal cisterns correlate strongly with raised ICP and poor outcome, and often prompt ICP monitoring even with a reassuring GCS."},{id:"w4d4q3",d:4,q:"The circle of Willis principally lies within which cistern?",o:["The suprasellar (chiasmatic) and interpeduncular cisterns","The quadrigeminal cistern","Cisterna magna","The cistern of the lamina terminalis only"],a:0,e:"Because the circle of Willis sits in CSF, aneurysm rupture produces subarachnoid haemorrhage that fills the basal cisterns — the pattern you see as a 'star' of blood on non-contrast CT."},{id:"w4d4q4",d:4,q:"Blood predominantly in the interhemispheric fissure and anterior cisterns on CT suggests an aneurysm at:",o:["The anterior communicating artery","The posterior communicating artery","The MCA bifurcation","The basilar tip"],a:0,e:"Blood distribution is a legitimate clue to aneurysm location before angiography: ACom fills the interhemispheric fissure, PCom the ipsilateral suprasellar region, MCA the Sylvian fissure, basilar tip the interpeduncular cistern."},{id:"w4d4q5",d:4,q:"The ambient (perimesencephalic) cistern contains which artery and nerve?",o:["Posterior cerebral artery, superior cerebellar artery and CN IV","Basilar artery and CN VI","Anterior choroidal artery and CN II","PICA and CN IX"],a:0,e:"It wraps around the midbrain. CN III passes between PCA and SCA here — the anatomical basis of third nerve palsy in PCom aneurysm and in uncal herniation."},{id:"w4d5q1",d:5,q:"A biconvex (lentiform) hyperdense collection that does not cross suture lines is:",o:["An extradural haematoma","A subdural haematoma","A subarachnoid haemorrhage","An intraparenchymal haematoma"],a:0,e:"Extradural blood strips dura off bone but is limited by the firm attachment at sutures — hence the lens shape. It *can* cross the midline (unlike subdural, which is limited by the falx) because it is outside the dura."},{id:"w4d5q2",d:5,q:"A crescentic collection that crosses suture lines but not the midline is:",o:["A subdural haematoma","An extradural haematoma","An epidural abscess","A subarachnoid haemorrhage"],a:0,e:"Subdural blood spreads freely over the convexity but is stopped by the falx. It arises from torn bridging veins, which is why it is common in the elderly and in alcoholics where brain atrophy stretches these veins."},{id:"w4d5q3",d:5,q:"The 'lucid interval' is most characteristic of which lesion?",o:["Extradural haematoma","Acute subdural haematoma","Diffuse axonal injury","Chronic subdural haematoma"],a:0,e:"Initial concussion, recovery, then deterioration as arterial extradural blood accumulates. It occurs in a minority of cases — its absence does not exclude the diagnosis, and its presence demands urgent CT and evacuation."},{id:"w4d5q4",d:5,q:"The subdural space is best described as:",o:["A potential space that only becomes real when pathology separates dural border cells","A true anatomical space filled with CSF","A space filled with fat and veins","Continuous with the ventricles"],a:0,e:"Modern anatomy regards subdural collections as splitting the dural border cell layer rather than filling a pre-existing space. The subarachnoid space, by contrast, is a genuine CSF-containing space."},{id:"w4d5q5",d:5,q:"Bridging veins are torn in which type of haemorrhage?",o:["Subdural haematoma","Extradural haematoma","Intraventricular haemorrhage","Epidural spinal haematoma"],a:0,e:"They cross from cortex to superior sagittal sinus and are stretched by brain atrophy or rapid acceleration–deceleration. This is also the proposed mechanism in abusive head trauma in infants."},{id:"w4d6q1",d:6,q:"In an adult, at which level is a lumbar puncture safely performed and why?",o:["L3/4 or L4/5, below the conus medullaris which usually ends at L1/2","T12/L1, above the conus","L1/2, at the conus","S1/2, in the sacral canal"],a:0,e:"The cord ends at L1/2 in adults, so the needle enters the lumbar cistern containing only cauda equina roots, which are mobile and displace. In neonates the conus lies lower (around L3), so puncture is performed lower still."},{id:"w4d6q2",d:6,q:"Which finding is the strongest contraindication to immediate lumbar puncture in suspected meningitis?",o:["Focal neurological deficit or signs of raised ICP","Fever above 39°C","Neck stiffness","Petechial rash"],a:0,e:"LP below a pressure gradient risks tonsillar herniation. Imaging first if there are focal signs, papilloedema, seizures or reduced consciousness — but never delay antibiotics while waiting for the scan."},{id:"w4d6q3",d:6,q:"Xanthochromia in CSF after a headache indicates:",o:["Breakdown of red cells from subarachnoid haemorrhage, typically detectable after about 12 hours","A traumatic tap","Bacterial meningitis","Raised protein alone"],a:0,e:"Bilirubin from haemolysed red cells gives the yellow tinge, best detected by spectrophotometry. It takes around 12 hours to develop, so LP for suspected SAH with a negative CT should be timed accordingly."},{id:"w4d6q4",d:6,q:"A patient improves after removal of 30–50 mL of CSF at lumbar puncture. What condition is being tested for?",o:["Normal pressure hydrocephalus (the tap test predicting shunt response)","Idiopathic intracranial hypertension","Chronic meningitis","Chiari malformation"],a:0,e:"Improvement in gait after high-volume CSF removal is the best simple predictor of shunt benefit in NPH. Extended lumbar drainage over several days is more sensitive but carries more risk."},{id:"w4d6q5",d:6,q:"Post-dural puncture headache is classically:",o:["Positional — worse on sitting or standing, relieved by lying flat","Worse lying flat and relieved by standing","Unrelated to posture","Only present at night"],a:0,e:"CSF leak lowers intracranial volume and causes traction on pain-sensitive structures when upright. Contrast this with raised-ICP headache, which is classically worse lying flat and in the early morning — the exact opposite pattern."},{id:"w4d7q1",d:7,q:"Which structure does the free edge of the falx cerebri permit herniation beneath?",o:["Cingulate gyrus — subfalcine herniation","Uncus — uncal herniation","Cerebellar tonsils","Diencephalon"],a:0,e:"Subfalcine (cingulate) herniation is the commonest type and can compress the anterior cerebral artery, causing contralateral leg weakness. Uncal herniation passes under the *tentorial* edge, not the falx."},{id:"w4d7q2",d:7,q:"Which of the following describes communicating hydrocephalus?",o:["Obstruction to CSF absorption or flow outside the ventricular system, with all ventricles enlarged","Obstruction at the aqueduct","Obstruction at the foramen of Monro","Excess CSF production only"],a:0,e:"Communicating means CSF still passes out of the ventricular system but fails to be absorbed — post-haemorrhagic, post-meningitic, or NPH. Obstructive (non-communicating) hydrocephalus blocks an intraventricular link and produces a characteristic pattern of selective dilatation."},{id:"w4d7q3",d:7,q:"Hydrocephalus ex vacuo refers to:",o:["Ventricular enlargement secondary to brain atrophy, without raised pressure","Acute obstructive hydrocephalus","Hydrocephalus after shunt failure","Overdrainage"],a:0,e:"It is a compensatory enlargement, not true hydrocephalus, and shunting does not help. Distinguishing it from NPH — where the ventricles are disproportionately large relative to sulcal atrophy — is a common clinical problem."},{id:"w4d7q4",d:7,q:"Which vein drains into the superior sagittal sinus and is at risk in a parasagittal craniotomy?",o:["Bridging cortical veins, notably the vein of Trolard","Vein of Labbé","Internal cerebral vein","Basal vein of Rosenthal"],a:0,e:"The vein of Trolard is the dominant superior anastomotic vein to the SSS; the vein of Labbé drains to the transverse sinus and is the classic casualty of the temporal approach, risking venous infarction and aphasia on the dominant side."},{id:"w4d7q5",d:7,q:"Occlusion of the posterior third of the superior sagittal sinus typically causes:",o:["Bilateral parasagittal venous infarction with leg weakness","Unilateral MCA territory infarct","Brainstem infarct","No deficit, as collaterals are always adequate"],a:0,e:"The posterior SSS is not safely sacrificable, unlike the anterior third which can often be ligated. Bilateral parasagittal infarction affects the leg areas of both motor cortices — a devastating and avoidable complication."}],5:[{id:"w5d1q1",d:1,q:"Which vessels form the circle of Willis?",o:["ACA and ACom anteriorly; ICA laterally; PCom and PCA posteriorly, fed by the basilar","MCA, ACA and PCA only","ICA, MCA and basilar only","Vertebral, basilar and PCA only"],a:0,e:"Note what is NOT part of the circle: the middle cerebral arteries are branches off it, not components. Drawing this from memory — and correctly excluding the MCA — is a standard viva opener."},{id:"w5d1q2",d:1,q:"What proportion of people have a complete, symmetrical circle of Willis?",o:["Fewer than half — anatomical variation is the rule","Over 90%","About 75%","Essentially everyone"],a:0,e:"Hypoplastic or absent PCom and A1 segments are common. This variability explains why identical vessel occlusions produce very different deficits between patients, and why collateral assessment matters before carotid sacrifice."},{id:"w5d1q3",d:1,q:"A 'fetal' posterior cerebral artery means:",o:["The PCA is supplied predominantly by the ICA via a large PCom, with a hypoplastic P1","The PCA is absent","The PCA arises from the MCA","The basilar supplies both PCAs equally"],a:0,e:"Present in roughly 20–30% of hemispheres. It matters clinically: an ICA occlusion can then infarct PCA territory, and the visual cortex loses its posterior circulation collateral protection."},{id:"w5d1q4",d:1,q:"The most common site for an intracranial saccular aneurysm is:",o:["The anterior communicating artery complex","The basilar tip","The MCA bifurcation","PICA origin"],a:0,e:"ACom is the single commonest site, followed by PCom origin and MCA bifurcation. About 85–90% of intracranial aneurysms arise in the anterior circulation — a figure worth quoting precisely."},{id:"w5d1q5",d:1,q:"Saccular aneurysms characteristically arise at:",o:["Arterial bifurcations, where the media is deficient and haemodynamic stress is highest","Mid-segments of straight vessels","Capillary beds","Venous junctions"],a:0,e:"The tunica media thins at branch points and flow-related shear stress concentrates there. This is why aneurysms cluster at the ACom, PCom origin, MCA bifurcation and basilar tip rather than randomly."},{id:"w5d2q1",d:2,q:"In the Bouthillier classification, which ICA segment lies within the cavernous sinus?",o:["C4","C1","C6","C7"],a:0,e:"C1 cervical, C2 petrous, C3 lacerum, C4 cavernous, C5 clinoid, C6 ophthalmic, C7 communicating. Knowing that C4 is cavernous explains why aneurysms there can rupture into the sinus and cause a carotid–cavernous fistula rather than SAH."},{id:"w5d2q2",d:2,q:"The first intradural branch of the internal carotid artery is:",o:["The ophthalmic artery","The posterior communicating artery","The anterior choroidal artery","The middle meningeal artery"],a:0,e:"It arises just after the ICA pierces the dural ring, then passes through the optic canal below the nerve. Its origin marks the transition from extradural to intradural — critical when planning clipping and deciding whether rupture would cause SAH."},{id:"w5d2q3",d:2,q:"Occlusion of the anterior choroidal artery classically produces which triad?",o:["Contralateral hemiplegia, hemianaesthesia and homonymous hemianopia","Aphasia, agraphia and acalculia","Ataxia, vertigo and nystagmus","Bitemporal hemianopia with ptosis"],a:0,e:"It supplies the posterior limb of the internal capsule, optic tract and parts of the thalamus and choroid plexus. Despite its small calibre, occlusion produces a dense and characteristic deficit — hence its surgical significance during aneurysm clipping."},{id:"w5d2q4",d:2,q:"Amaurosis fugax results from emboli travelling to which vessel?",o:["The ophthalmic artery and its central retinal branch","The middle cerebral artery","The posterior cerebral artery","The anterior choroidal artery"],a:0,e:"Transient monocular visual loss 'like a curtain descending' from carotid bifurcation atheroembolism. It is a warning of impending stroke and mandates urgent carotid imaging — one of the few genuinely time-critical outpatient referrals."},{id:"w5d2q5",d:2,q:"A 'string of beads' appearance on carotid angiography suggests:",o:["Fibromuscular dysplasia","Atherosclerosis","Moyamoya disease","Giant cell arteritis"],a:0,e:"FMD affects young to middle-aged women and predisposes to dissection and to intracranial aneurysm. Moyamoya instead shows progressive supraclinoid ICA stenosis with a 'puff of smoke' collateral network."},{id:"w5d3q1",d:3,q:"Occlusion of the anterior cerebral artery distal to ACom causes weakness that is:",o:["Worse in the contralateral leg than the arm","Worse in the contralateral arm and face","Global on the contralateral side","Ipsilateral to the occlusion"],a:0,e:"The ACA supplies the medial surface of the hemisphere where the leg is represented on the homunculus. MCA occlusion does the opposite — face and arm worse than leg. This single distinction localises most hemispheric strokes at the bedside."},{id:"w5d3q2",d:3,q:"The recurrent artery of Heubner arises from which segment and supplies what?",o:["Usually the A2 or A1/A2 junction, supplying the head of the caudate and anterior limb of the internal capsule","The M1 segment, supplying the putamen","The PCom, supplying the thalamus","The basilar, supplying the pons"],a:0,e:"Injury during ACom aneurysm surgery causes contralateral facio-brachial weakness and sometimes abulia. It is one of the perforators surgeons name explicitly in operation notes."},{id:"w5d3q3",d:3,q:"Bilateral ACA territory infarction can produce which syndrome?",o:["Akinetic mutism with paraparesis and incontinence","Cortical blindness","Locked-in syndrome","Wernicke aphasia"],a:0,e:"Damage to bilateral medial frontal lobes and the cingulate produces abulia or akinetic mutism. It can follow ACom aneurysm rupture or an azygos ACA variant where one vessel supplies both hemispheres."},{id:"w5d3q4",d:3,q:"The callosomarginal and pericallosal arteries are branches of:",o:["The anterior cerebral artery","The middle cerebral artery","The posterior cerebral artery","The anterior choroidal artery"],a:0,e:"The pericallosal artery runs above the corpus callosum in the callosal sulcus. Distal ACA (pericallosal) aneurysms are relatively rare and technically demanding because of the deep interhemispheric approach required."},{id:"w5d3q5",d:3,q:"Which ACom aneurysm rupture complication is caused by hypothalamic and forniceal perforator injury?",o:["Memory disturbance and endocrine dysfunction including diabetes insipidus","Hemianopia","Hearing loss","Facial palsy"],a:0,e:"The ACom complex sends perforators to the hypothalamus, fornix and septal region. This is why ACom SAH survivors often have prominent amnesia and personality change out of proportion to their motor recovery."},{id:"w5d4q1",d:4,q:"The lenticulostriate arteries arise from which segment and are clinically important because:",o:["M1 — they are end arteries supplying the internal capsule and basal ganglia, and rupture causes hypertensive haemorrhage","M2 — they supply cortex","M3 — they supply the insula","M4 — they supply the convexity"],a:0,e:"Charcot–Bouchard microaneurysms on these perforators are the classic site of hypertensive putaminal haemorrhage. Because they are end arteries, occlusion causes lacunar infarction with a pure motor hemiparesis."},{id:"w5d4q2",d:4,q:"A patient has fluent but meaningless speech with impaired comprehension after a stroke. Which artery territory?",o:["Inferior division of the left MCA (Wernicke's area, superior temporal gyrus)","Superior division of the left MCA","Left ACA",
